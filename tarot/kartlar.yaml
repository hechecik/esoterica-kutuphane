  4: { ad: "Dörtlü", tema: "istikrar, duraklama" }
  5: { ad: "Beşli", tema: "çatışma, kayıp, sınav" }
  6: { ad: "Altılı", tema: "uyum, geçiş, iyileşme" }
  7: { ad: "Yedili", tema: "sınama, değerlendirme" }
  8: { ad: "Sekizli", tema: "hareket, ustalık" }
  9: { ad: "Dokuzlu", tema: "doruk öncesi, yoğunlaşma" }
  10: { ad: "Onlu", tema: "döngünün sonu, tamamlanma" }
  11: { ad: "Uşak", tema: "haber, öğrenci, merak" }
  12: { ad: "Şövalye", tema: "hareket, arayış, aşırılık" }
