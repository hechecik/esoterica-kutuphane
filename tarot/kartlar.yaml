kaynak: "Esoterica tarot kütüphanesi; Rider-Waite-Smith geleneği (1909, kamu malı) temel alınarak özgün Türkçe metin"
lang: tr
buyuk:
  - { no: 0, key: deli, ad: "Deli", anahtar: "başlangıç, saflık, sıçrama",
      duz: ["Deli uçurumun kenarında, gözü gökyüzünde: yeni bir yolculuğun ilk adımı. Bilmemek burada bir eksiklik değil, bir özgürlük.", "Hesapsız bir cesaret zamanı. Her şeyi bilmeden de başlayabilirsin; yol yürüdükçe açılır."],
      ters: ["Deli ters: düşünmeden atılan adım ya da korkudan atılamayan adım. Ya fren ya gaz eksik.", "Saflık burada dikkatsizliğe dönüşebilir; heyecanına bir harita ekle."],
      ask: "Aşkta Deli: yeni, hafif ve kuralsız bir başlangıç; etiket koymadan yaşanan bir heyecan.",
      is: "İşte Deli: yeni bir alan, deneme, risk; deneyim eksikliğini cesaretle kapatacaksın.",
      ogut: "Atla, ama nereye bastığına da bak." }
  - { no: 1, key: buyucu, ad: "Büyücü", anahtar: "irade, beceri, yaratma",
      duz: ["Büyücü'nün masasında dört element hazır: elindeki araçlar yeterli. Niyetini eyleme dökme zamanı.", "Becerin, sözün ve iraden aynı hizada. Ne istediğini bil; o zaman yapabilirsin."],
      ters: ["Büyücü ters: yetenek var ama dağınık; ya da araçlar başkasını kandırmak için kullanılıyor.", "Kendini küçümseme ya da başkasının oyununa gelme; ikisi de enerjini çalar."],
      ask: "Aşkta Büyücü: çekim güçlü, ilk adımı atma yeteneği sende. Sözlerin büyüleyici; dürüst kal.",
      is: "İşte Büyücü: yeni bir proje, bir sunum, bir girişim; becerilerini göstermenin tam zamanı.",
      ogut: "Elindekiyle başla; eksik olan, yolda tamamlanır." }
  - { no: 2, key: basrahibe, ad: "Başrahibe", anahtar: "sezgi, sır, sessizlik",
      duz: ["Başrahibe perdenin önünde oturuyor: cevap dışarıda değil, içeride. Sessizlik şu an en iyi danışman.", "Söylenmeyen bir şey var; sezgin onu zaten biliyor. Acele etmeden dinle."],
      ters: ["Başrahibe ters: iç sesi bastırmak ya da sırların ağırlığı. Sezgini görmezden geliyorsun.", "Gizlenen bir bilgi açığa çıkmak üzere olabilir; hazırlıklı ol."],
      ask: "Aşkta Başrahibe: sessiz bir çekim, henüz dile gelmemiş duygular; sabır ve sezgi.",
      is: "İşte Başrahibe: bilgi topla, kartlarını açma; zamanı gelince konuşursun.",
      ogut: "Cevabı soruda değil, sessizlikte ara." }
  - { no: 3, key: imparatorice, ad: "İmparatoriçe", anahtar: "bereket, şefkat, yaratıcılık",
      duz: ["İmparatoriçe bahçesinde: ekilen yeşeriyor. Bereket, güzellik ve büyüme zamanı.", "Yaratıcılığın ve şefkatin bolluk getiriyor; kendine ve sevdiklerine bakım ver."],
      ters: ["İmparatoriçe ters: verirken kendini tüketmek ya da büyümenin tıkanması.", "Fazla bağımlılık ya da yaratıcı kuraklık; önce kendini besle."],
      ask: "Aşkta İmparatoriçe: sıcak, besleyici, bereketli bir bağ; aile ya da çocuk teması olabilir.",
      is: "İşte İmparatoriçe: yaratıcı projeler meyve veriyor; bolluk ve keyifle çalışma.",
      ogut: "Büyümek için bakım gerekir; sulamayı unutma." }
  - { no: 4, key: imparator, ad: "İmparator", anahtar: "düzen, otorite, yapı",
      duz: ["İmparator tahtında: kurallar, sınırlar ve sağlam bir yapı. Düzen kurma zamanı.", "Liderlik ve sorumluluk sende; kararlı ol, planına sadık kal."],
      ters: ["İmparator ters: katılık, aşırı kontrol ya da otoriteyle çatışma.", "Ya fazla sert ya fazla dağınık; yapının seni boğmadan taşıması gerek."],
      ask: "Aşkta İmparator: güven veren, koruyucu ama kontrolcü olabilen bir partner; istikrar.",
      is: "İşte İmparator: yöneticilik, yapılandırma, resmi süreçler; otoriteyle iyi ilişki kur.",
      ogut: "Sınır koymak sevgisizlik değil, sağlamlıktır." }
  - { no: 5, key: basrahip, ad: "Başrahip", anahtar: "gelenek, öğreti, rehber",
      duz: ["Başrahip öğretiyi temsil eder: denenmiş yollar, bir öğretmen, bir topluluk. Bilgeliği bilenden öğren.", "Gelenek ve kurumlar şu an destekleyici; kuralların içinde güvenli bir yol var."],
      ters: ["Başrahip ters: dayatılan kurallara isyan ya da kendi yolunu bulma ihtiyacı.", "Hazır cevaplar sana yetmiyor; kendi inancını sorgulama zamanı."],
      ask: "Aşkta Başrahip: geleneksel bir bağ, resmiyet, evlilik ya da ailelerin onayı.",
      is: "İşte Başrahip: eğitim, sertifika, kurumsal yapı; bir akıl hocası işine yarar.",
      ogut: "Bir öğretmen bul ya da bir öğretmen ol." }
  - { no: 6, key: asiklar, ad: "Âşıklar", anahtar: "seçim, birleşme, değerler",
      duz: ["Âşıklar kalbin seçimidir: değerlerinle uyumlu bir birleşme, derin bir bağ.", "Bir yol ayrımındasın; doğru seçim, kalbinle aklının aynı yeri gösterdiği yerdedir."],
      ters: ["Âşıklar ters: kararsızlık, uyumsuz değerler ya da bir ilişkide dengesizlik.", "Seçimini başkasının yerine yaşamaya çalışıyorsun; kendi değerine dön."],
      ask: "Aşkta Âşıklar: güçlü bir çekim, karşılıklı bağlılık; ciddi bir ilişki kararı.",
      is: "İşte Âşıklar: önemli bir ortaklık ya da değerlerine göre verilecek bir karar.",
      ogut: "Seçerken kendine sor: bu, benim gerçekten değer verdiğim şey mi?" }
  - { no: 7, key: araba, ad: "Savaş Arabası", anahtar: "irade, zafer, ilerleme",
      duz: ["Savaş Arabası iki zıt atı tek yöne sürer: irade ve odakla zafer.", "Engeller var ama kontrol sende; kararlılık seni ileri taşıyor."],
      ters: ["Savaş Arabası ters: yön kaybı, çatışan istekler, kontrolün elden gitmesi.", "Hızlanmadan önce dizginleri topla; hangi yöne gittiğini netleştir."],
      ask: "Aşkta Savaş Arabası: ilişkide ilerleme, bir hedefe birlikte yürümek; ya da birinin dizginleri tutması.",
      is: "İşte Savaş Arabası: rekabette başarı, bir projeyi sona kadar götürmek, iş için yolculuk.",
      ogut: "Odaklan; dağınık güç zafer getirmez." }
  - { no: 8, key: guc, ad: "Güç", anahtar: "sabır, iç güç, şefkat",
      duz: ["Güç kartında kadın aslanı şefkatle yatıştırır: gerçek güç kaba kuvvet değil, sakin cesarettir.", "İçindeki vahşi tarafı bastırmadan yönetebiliyorsun; sabır seni kazandıracak."],
      ters: ["Güç ters: kendinden şüphe, öfke ya da korkuya teslim olmak.", "İçindeki aslan ya kükrüyor ya saklanıyor; ikisi de dengeyi bozuyor."],
      ask: "Aşkta Güç: sabırla güçlenen bir bağ; yumuşaklık sertlikten daha etkili.",
      is: "İşte Güç: zor bir kişiyi ya da durumu sakinlikle yönetmek; dayanıklılık.",
      ogut: "Yumuşaklıkla tutulan, kuvvetle tutulandan uzun kalır." }
  - { no: 9, key: ermis, ad: "Ermiş", anahtar: "iç yolculuk, yalnızlık, bilgelik",
      duz: ["Ermiş elinde fenerle dağda: içe dönme, düşünme ve kendi ışığını bulma zamanı.", "Kalabalıktan uzaklaşmak sana cevap verecek; yalnızlık burada bir arınma."],
      ters: ["Ermiş ters: yalnızlığın yalıtılmışlığa dönüşmesi ya da içe bakmaktan kaçmak.", "Ya fazla çekildin ya hiç durmadın; denge bul."],
      ask: "Aşkta Ermiş: bir ara verme, kendini tanıma dönemi; ya da derin ama sessiz bir bağ.",
      is: "İşte Ermiş: araştırma, uzmanlık, tek başına derin çalışma; acele kararlardan kaçın.",
      ogut: "Fenerini önce kendi yoluna tut." }
  - { no: 10, key: cark, ad: "Kader Çarkı", anahtar: "döngü, şans, dönüm noktası",
      duz: ["Kader Çarkı dönüyor: değişim kapıda, şans yön değiştiriyor. Akışla birlikte hareket et.", "Bir döngü kapanıyor, yenisi açılıyor; fırsatı gördüğünde yakala."],
      ters: ["Kader Çarkı ters: istenmeyen bir değişim ya da tekrar eden bir kalıp.", "Aynı noktaya dönüp duruyorsan, çarkı değil kendi tepkini değiştir."],
      ask: "Aşkta Kader Çarkı: beklenmedik bir karşılaşma ya da ilişkide bir dönüm noktası.",
      is: "İşte Kader Çarkı: şanslı bir fırsat, bir değişim; esnek olan kazanır.",
      ogut: "Çark döner; tepede kibirlenme, dipte umutsuzlanma." }
  - { no: 11, key: adalet, ad: "Adalet", anahtar: "denge, hakikat, sonuç",
      duz: ["Adalet terazisi dengede: ne ekersen onu biçersin. Dürüstlük ve netlik zamanı.", "Hukuki, resmi ya da ahlaki bir karar adil biçimde sonuçlanıyor."],
      ters: ["Adalet ters: dengesizlik, haksızlık ya da sorumluluktan kaçmak.", "Gerçeği görmezden gelmek sonucu değiştirmez; yüzleşmek gerekiyor."],
      ask: "Aşkta Adalet: eşit ve dürüst bir ilişki; ya da bir ilişkinin hakkaniyetle değerlendirilmesi.",
      is: "İşte Adalet: sözleşmeler, hukuki işler, adil bir karar; belgeleri dikkatle oku.",
      ogut: "Dürüst ol; önce kendine." }
  - { no: 12, key: asilan, ad: "Asılan Adam", anahtar: "bekleyiş, teslimiyet, yeni bakış",
      duz: ["Asılan Adam baş aşağı ama huzurlu: dünyaya ters taraftan bakınca yeni bir şey görüyor.", "Şimdi eylem değil bekleyiş zamanı; bırakınca anlayacaksın."],
      ters: ["Asılan Adam ters: anlamsız bir bekleyiş, fedakârlığın sömürüye dönüşmesi.", "Askıda kalmaya alıştın; karar verme vakti geldi."],
      ask: "Aşkta Asılan Adam: belirsizlik, bekleme, bir fedakârlık; ilişkiye farklı bir açıdan bak.",
      is: "İşte Asılan Adam: projelerde duraklama; bu arayı stratejini gözden geçirmek için kullan.",
      ogut: "Bazen ilerlemek için durmak gerekir." }
  - { no: 13, key: olum, ad: "Ölüm", anahtar: "bitiş, dönüşüm, yeniden doğuş",
      duz: ["Ölüm kartı fiziksel bir son değil, bir dönemin kapanışıdır: eski deri dökülüyor, yenisi geliyor.", "Bir şey bitiyor ki başka bir şey başlayabilsin; bırakmak bu kartın armağanı."],
      ters: ["Ölüm ters: bitmesi gerekeni tutmaya çalışmak; değişime direnç.", "Kapıyı aralık bırakmak acıyı uzatır; kapatmak özgürleştirir."],
      ask: "Aşkta Ölüm: bir ilişkinin ya da ilişkideki eski hâlin sonu; yeni bir sayfa.",
      is: "İşte Ölüm: bir işin ya da dönemin kapanışı, köklü bir değişim, yeni bir başlangıca hazırlık.",
      ogut: "Biten için yas tut, gelen için kapıyı aç." }
  - { no: 14, key: denge, ad: "Denge", anahtar: "ölçü, uyum, sabır",
      duz: ["Denge kartında melek iki kap arasında suyu aktarıyor: ölçü, uyum ve sabırlı bir karışım.", "Aşırılıklardan uzak, orta yolda bir iyileşme; acele yok, akış var."],
      ters: ["Denge ters: aşırılık, sabırsızlık ya da uyumsuz parçaları zorla birleştirmek.", "Ölçü kaçmış; bir adım geri çekil ve yeniden dengele."],
      ask: "Aşkta Denge: uyumlu, sakin ve iyileştirici bir ilişki; karşılıklı anlayış.",
      is: "İşte Denge: iş birliği, sabırlı ilerleme, farklı unsurları uyumla birleştirme.",
      ogut: "Ne fazla ne eksik; tam kıvamında." }
  - { no: 15, key: seytan, ad: "Şeytan", anahtar: "bağımlılık, arzu, gölge",
      duz: ["Şeytan kartındaki zincirler gevşektir: bağlı olduğun şeyi bırakmak sandığından kolay.", "Arzular, alışkanlıklar ya da bir bağımlılık seni yönetiyor olabilir; gölgeni gör."],
      ters: ["Şeytan ters: zincirleri çıkarma, bir bağımlılıktan kurtuluş, farkındalık.", "Seni bağlayan şeyi gördün; şimdi özgürleşme zamanı."],
      ask: "Aşkta Şeytan: yoğun tutku, ama kontrol ya da bağımlılık riski; sağlıklı mı, sorgula.",
      is: "İşte Şeytan: para ya da güç için kendinden ödün verme riski; seni tutan şeye bak.",
      ogut: "Zinciri sen taşıyorsan, açacak olan da sensin." }
  - { no: 16, key: kule, ad: "Kule", anahtar: "sarsıntı, ani değişim, uyanış",
      duz: ["Kule'ye yıldırım düşüyor: sağlam sanılan bir yapı çöküyor. Sarsıcı, ama gerçeği ortaya çıkarıyor.", "Ani bir değişim ya da açığa çıkan bir gerçek; yıkılan şey zaten çürüktü."],
      ters: ["Kule ters: kaçınılan bir yüzleşme ya da kontrollü bir çöküş.", "Değişimi ertelemek onu durdurmaz; küçük adımlarla kendin başlat."],
      ask: "Aşkta Kule: ilişkide ani bir sarsıntı, bir itiraf ya da gerçeğin ortaya çıkması.",
      is: "İşte Kule: beklenmedik bir değişiklik, yapının yeniden kurulması; esnek ol.",
      ogut: "Yıkılan yerde daha sağlam bir şey kurabilirsin." }
  - { no: 17, key: yildiz, ad: "Yıldız", anahtar: "umut, şifa, ilham",
      duz: ["Yıldız fırtınadan sonra gelir: umut, şifa ve sakin bir ilham. Kendine yeniden inanma zamanı.", "Ruhun dinleniyor, yaralar kapanıyor; geleceğe güvenle bakabilirsin."],
      ters: ["Yıldız ters: umutsuzluk ya da kendine inancı kaybetmek.", "Işık hâlâ orada; bulutların arkasına bakmayı dene."],
      ask: "Aşkta Yıldız: iyileştirici, umut veren bir bağ; ya da kalbin yeniden açılması.",
      is: "İşte Yıldız: ilham dolu bir dönem, yaratıcı fikirler, uzun vadeli umutlu planlar.",
      ogut: "Umut bir yön değil, bir yakıt; yürümeye devam et." }
  - { no: 18, key: ay, ad: "Ay", anahtar: "belirsizlik, sezgi, rüya",
      duz: ["Ay kartında yol puslu: her şey göründüğü gibi değil. Sezgin rehberin, korkuların ise yanıltıcı.", "Bilinçaltından gelen rüyalar ve işaretler önemli; ama acele karar verme."],
      ters: ["Ay ters: pus dağılıyor, kafa karışıklığı netleşiyor; bir yanılsama çözülüyor.", "Korktuğun şey sandığın kadar büyük değilmiş."],
      ask: "Aşkta Ay: belirsizlik, söylenmeyenler, hayal ile gerçeğin karışması; netlik bekle.",
      is: "İşte Ay: belirsiz koşullar, eksik bilgi; sözleşmeleri imzalamadan önce iyice araştır.",
      ogut: "Gece yürüyorsan adımlarını yavaşlat." }
  - { no: 19, key: gunes, ad: "Güneş", anahtar: "neşe, başarı, açıklık",
      duz: ["Güneş kartı tarotun en parlak kartıdır: neşe, başarı, sağlık ve açıklık.", "Her şey aydınlanıyor; içindeki çocuk gibi sevin, kendini göster."],
      ters: ["Güneş ters: neşe gecikiyor ya da bulutlu; ama yine de güneş orada.", "Fazla iyimserlik ya da kendini abartma; ışığı paylaş."],
      ask: "Aşkta Güneş: mutlu, açık ve sıcak bir ilişki; birlikte parlamak.",
      is: "İşte Güneş: başarı, takdir, görünürlük; emeklerinin karşılığını alıyorsun.",
      ogut: "Işığını saklama; ısıtırsın." }
  - { no: 20, key: mahkeme, ad: "Mahkeme", anahtar: "uyanış, çağrı, yeniden doğuş",
      duz: ["Mahkeme kartında borazan çalıyor: bir çağrı, bir uyanış, geçmişin hesaplaşması ve yeni bir başlangıç.", "Kendini affet, geçmişi topla ve yükselmeye hazır ol."],
      ters: ["Mahkeme ters: çağrıyı duymazdan gelmek, kendini yargılamak.", "Geçmişin seni tutuyor; ders alıp bırakmak gerekiyor."],
      ask: "Aşkta Mahkeme: eski bir ilişkinin yeniden gündeme gelmesi ya da ilişkide büyük bir karar.",
      is: "İşte Mahkeme: kariyerinde bir çağrı, yeni bir aşama; hayalini kurduğun işe adım.",
      ogut: "Çağrıyı duyduysan cevap ver." }
  - { no: 21, key: dunya, ad: "Dünya", anahtar: "tamamlanma, bütünlük, başarı",
      duz: ["Dünya kartı bir döngünün tamamlanmasıdır: hedefe ulaşıldı, parça bütün oldu.", "Başarı, kutlama ve yeni bir döngünün eşiği; dünyaya açılma zamanı."],
      ters: ["Dünya ters: tamamlanamayan bir iş, son adımda tökezlemek.", "Bitirmediğin bir şey var; onu tamamlarsan özgürleşirsin."],
      ask: "Aşkta Dünya: tamamlanmış, olgun ve bütünlüklü bir ilişki; belki uzaklarla ilgili bir bağ.",
      is: "İşte Dünya: büyük bir projenin başarıyla bitişi, uluslararası fırsatlar.",
      ogut: "Kutla, sonra yeni yolculuğa çık." }
seriler:
  asa: { ad: "Asalar", element: "ateş", tema: "tutku, eylem, yaratıcılık, kariyer enerjisi",
         ask: "Asa serisi aşkta tutkuyu ve heyecanı anlatır.", is: "Asa serisi işte girişimi, hırsı ve yaratıcı projeleri anlatır." }
  kupa: { ad: "Kupalar", element: "su", tema: "duygular, ilişkiler, sezgi",
          ask: "Kupa serisi aşkın doğal dilidir: duygular, bağlar ve kalp.", is: "Kupa serisi işte ekip ruhunu, tatmini ve duygusal yatırımı anlatır." }
  kilic: { ad: "Kılıçlar", element: "hava", tema: "düşünce, çatışma, gerçek, karar",
           ask: "Kılıç serisi aşkta iletişimi, tartışmayı ve zihinsel mesafeyi anlatır.", is: "Kılıç serisi işte kararları, stratejiyi ve rekabeti anlatır." }
  tilsim: { ad: "Tılsımlar", element: "toprak", tema: "para, beden, emek, somut sonuç",
            ask: "Tılsım serisi aşkta istikrarı, güveni ve somut bağlılığı anlatır.", is: "Tılsım serisi işte parayı, emeği ve kalıcı sonuçları anlatır." }
