  14: { ad: "Kral", tema: "otorite, dış ustalık" }
kucuk:
  asa:
    1: { duz: "Asa ası: yeni bir tutku kıvılcımı, bir fikir, bir başlangıç enerjisi.", ters: "Asa ası ters: gecikmiş bir başlangıç, sönen heves." }
    2: { duz: "Asa ikilisi: dünyayı elinde tutarken ufka bakmak; plan yapma ve karar zamanı.", ters: "Asa ikilisi ters: korkudan konfor alanında kalmak." }
    3: { duz: "Asa üçlüsü: gemiler yolda; genişleme, uzaklarla bağlantı, ilk sonuçlar.", ters: "Asa üçlüsü ters: gecikmeler, beklenen geri dönüşün gelmemesi." }
    4: { duz: "Asa dörtlüsü: kutlama, eve dönüş, sağlam bir temel üzerinde sevinç.", ters: "Asa dörtlüsü ters: ev içinde huzursuzluk ya da ertelenen kutlama." }
    5: { duz: "Asa beşlisi: rekabet, fikir çatışması, enerjilerin çarpışması.", ters: "Asa beşlisi ters: çatışmadan kaçmak ya da tartışmanın bitmesi." }
    6: { duz: "Asa altılısı: zafer alayı, takdir, başarının görünür olması.", ters: "Asa altılısı ters: alkış beklerken hayal kırıklığı, gururun incinmesi." }
    7: { duz: "Asa yedilisi: yüksek yerde savunma; görüşünü korumak için direniyorsun.", ters: "Asa yedilisi ters: bunalmak, savunmayı bırakmak." }
    8: { duz: "Asa sekizlisi: hızlı haber, hızlı gelişme, havada uçan oklar.", ters: "Asa sekizlisi ters: gecikmeler, aceleden doğan karışıklık." }
    9: { duz: "Asa dokuzlusu: yorgun ama ayakta; son bir direniş, dayanıklılık.", ters: "Asa dokuzlusu ters: tükenmişlik, güvensizlik." }
    10: { duz: "Asa onlusu: fazla yük; her şeyi tek başına taşımaya çalışıyorsun.", ters: "Asa onlusu ters: yükü bırakmak, görev paylaşmak." }
    11: { duz: "Asaların uşağı: heyecan verici bir haber, yeni bir merak, keşif ruhu.", ters: "Asaların uşağı ters: odaksız heves, yarım kalan fikirler." }
    12: { duz: "Asaların şövalyesi: macera, hızlı hareket, tutkulu bir atılım.", ters: "Asaların şövalyesi ters: düşüncesizlik, sabırsızlık." }
    13: { duz: "Asaların kraliçesi: özgüvenli, sıcak, karizmatik; enerjisiyle ilham veren biri.", ters: "Asaların kraliçesi ters: kıskançlık ya da özgüven eksikliği." }
    14: { duz: "Asaların kralı: vizyoner lider; büyük düşünen ve harekete geçiren.", ters: "Asaların kralı ters: zorbalık ya da aşırı beklenti." }
  kupa:
    1: { duz: "Kupa ası: taşan bir kalp; yeni bir sevgi, duygusal başlangıç, şefkat.", ters: "Kupa ası ters: duyguları tutmak, kalbin kapanması." }
    2: { duz: "Kupa ikilisi: karşılıklı çekim, ortaklık, kadeh kaldıran iki kalp.", ters: "Kupa ikilisi ters: uyumsuzluk, kopukluk." }
    3: { duz: "Kupa üçlüsü: dostluk, kutlama, birlikte sevinmek.", ters: "Kupa üçlüsü ters: dedikodu, aşırılık ya da dostluklarda gerginlik." }
    4: { duz: "Kupa dörtlüsü: ilgisizlik, sunulana bakmamak; içe kapanma.", ters: "Kupa dörtlüsü ters: yeni bir fırsatı fark etmek, uyanış." }
    5: { duz: "Kupa beşlisi: dökülen kupalara yas; ama arkada iki kupa hâlâ dolu.", ters: "Kupa beşlisi ters: kabullenme, ileriye bakma." }
    6: { duz: "Kupa altılısı: nostalji, çocukluk anıları, eski bir dostun dönüşü.", ters: "Kupa altılısı ters: geçmişe takılı kalmak." }
    7: { duz: "Kupa yedilisi: çok fazla seçenek, hayaller, yanılsamalar; gerçek olanı seç.", ters: "Kupa yedilisi ters: netlik, hayalden gerçeğe dönüş." }
    8: { duz: "Kupa sekizlisi: tatmin etmeyeni geride bırakıp daha derin bir anlam aramaya gitmek.", ters: "Kupa sekizlisi ters: gitmekten korkmak ya da amaçsız dolaşmak." }
    9: { duz: "Kupa dokuzlusu: dilek kartı; tatmin, keyif, dileğin gerçekleşmesi.", ters: "Kupa dokuzlusu ters: yüzeysel tatmin, kibir." }
    10: { duz: "Kupa onlusu: gökkuşağı altında mutlu bir aile; duygusal doyum.", ters: "Kupa onlusu ters: aile içi uyumsuzluk." }
    11: { duz: "Kupaların uşağı: tatlı bir haber, bir aşk mesajı, yaratıcı bir sezgi.", ters: "Kupaların uşağı ters: duygusal olgunlaşmamışlık." }
    12: { duz: "Kupaların şövalyesi: romantik bir teklif, kalpten gelen bir davet.", ters: "Kupaların şövalyesi ters: hayalperestlik, tutulmayan sözler." }
    13: { duz: "Kupaların kraliçesi: şefkatli, sezgisel, duygusal olarak olgun biri.", ters: "Kupaların kraliçesi ters: aşırı hassasiyet, duygusal bağımlılık." }
    14: { duz: "Kupaların kralı: duygularına hâkim, sakin ve bilge biri.", ters: "Kupaların kralı ters: duygusal manipülasyon ya da bastırılmış duygular." }
  kilic:
    1: { duz: "Kılıç ası: berrak bir fikir, gerçeğin ortaya çıkması, keskin bir karar.", ters: "Kılıç ası ters: kafa karışıklığı, yanlış karar." }
    2: { duz: "Kılıç ikilisi: gözler bağlı bir kararsızlık; seçmekten kaçınmak.", ters: "Kılıç ikilisi ters: bilgi açığa çıkıyor, karar zamanı." }
    3: { duz: "Kılıç üçlüsü: kalp kırıklığı, acı bir gerçek; ama yağmur geçer.", ters: "Kılıç üçlüsü ters: iyileşme, acının hafiflemesi." }
    4: { duz: "Kılıç dörtlüsü: dinlenme, ara verme, iyileşme için çekilme.", ters: "Kılıç dörtlüsü ters: huzursuzluk, dinlenememe." }
    5: { duz: "Kılıç beşlisi: kazanılan ama tadı kaçan bir zafer; çatışmanın bedeli.", ters: "Kılıç beşlisi ters: barışma, geçmişi geride bırakma." }
    6: { duz: "Kılıç altılısı: sakin sulara geçiş; zor bir dönemden uzaklaşmak.", ters: "Kılıç altılısı ters: geçişte zorluk, geride kalanın ağırlığı." }
    7: { duz: "Kılıç yedilisi: strateji, gizlilik ya da birinin sinsice davranması; dikkat.", ters: "Kılıç yedilisi ters: gerçeğin ortaya çıkması, itiraf." }
    8: { duz: "Kılıç sekizlisi: kendi korkularınla bağlanmışsın; çıkış sandığından yakın.", ters: "Kılıç sekizlisi ters: özgürleşme, yeni bakış." }
    9: { duz: "Kılıç dokuzlusu: gece endişeleri, uykusuzluk; korkular gerçekten büyük görünüyor.", ters: "Kılıç dokuzlusu ters: endişenin azalması, umut." }
    10: { duz: "Kılıç onlusu: dibe vurmak; daha kötüsü yok, artık yükseliş başlar.", ters: "Kılıç onlusu ters: toparlanma, ayağa kalkma." }
    11: { duz: "Kılıçların uşağı: meraklı, gözlemci; bir haber ya da yeni bir fikir.", ters: "Kılıçların uşağı ters: dedikodu, düşüncesiz söz." }
    12: { duz: "Kılıçların şövalyesi: hızlı, kararlı, doğrudan; fikir için atılım.", ters: "Kılıçların şövalyesi ters: saldırganlık, acele." }
    13: { duz: "Kılıçların kraliçesi: net, dürüst, bağımsız; gerçeği söyleyen biri.", ters: "Kılıçların kraliçesi ters: soğukluk, sert eleştiri." }
    14: { duz: "Kılıçların kralı: mantık ve adaletle karar veren otorite.", ters: "Kılıçların kralı ters: gücün kötüye kullanılması, katılık." }
  tilsim:
    1: { duz: "Tılsım ası: maddi bir fırsat, sağlam bir başlangıç, bereket tohumu.", ters: "Tılsım ası ters: kaçan fırsat, kötü planlama." }
    2: { duz: "Tılsım ikilisi: dengede tutulan işler; esnek bütçe, birden çok sorumluluk.", ters: "Tılsım ikilisi ters: dengeyi kaybetmek, aşırı yük." }
    3: { duz: "Tılsım üçlüsü: ekip çalışması, ustalık, takdir edilen emek.", ters: "Tılsım üçlüsü ters: uyumsuz ekip, özensiz iş." }
    4: { duz: "Tılsım dörtlüsü: sıkı tutmak; güvenlik isteği, biriktirme.", ters: "Tılsım dörtlüsü ters: cimrilik ya da kontrolsüz harcama." }
    5: { duz: "Tılsım beşlisi: maddi zorluk, dışarıda kalmışlık; ama yardım yakında.", ters: "Tılsım beşlisi ters: toparlanma, desteğin gelmesi." }
    6: { duz: "Tılsım altılısı: vermek ve almak; cömertlik, destek, adil paylaşım.", ters: "Tılsım altılısı ters: borç, dengesiz alışveriş." }
    7: { duz: "Tılsım yedilisi: emeğin meyvesini bekleme; sabırlı değerlendirme.", ters: "Tılsım yedilisi ters: sabırsızlık, karşılıksız emek." }
    8: { duz: "Tılsım sekizlisi: ustalaşma, dikkatli çalışma, bir zanaatı öğrenmek.", ters: "Tılsım sekizlisi ters: aceleye getirilmiş iş, mükemmeliyetçilik." }
    9: { duz: "Tılsım dokuzlusu: bağımsız bolluk; kendi emeğinle kurduğun bahçe.", ters: "Tılsım dokuzlusu ters: aşırı çalışma, bağımlılık." }
    10: { duz: "Tılsım onlusu: kalıcı servet, aile mirası, köklü güvenlik.", ters: "Tılsım onlusu ters: aile içi para anlaşmazlıkları." }
    11: { duz: "Tılsımların uşağı: öğrenme, yeni bir maddi fırsat, ciddi bir öğrenci.", ters: "Tılsımların uşağı ters: odaksızlık, erteleme." }
    12: { duz: "Tılsımların şövalyesi: yavaş ama emin adımlar, sorumluluk, güvenilirlik.", ters: "Tılsımların şövalyesi ters: durgunluk, aşırı temkin." }
    13: { duz: "Tılsımların kraliçesi: pratik, besleyici, bereketli; evi ve işi bir arada çeviren.", ters: "Tılsımların kraliçesi ters: kendini ihmal, aşırı endişe." }
    14: { duz: "Tılsımların kralı: maddi başarı, güvenilir otorite, cömert bir patron.", ters: "Tılsımların kralı ters: hırs, materyalizm." }
