       ask: "Aşkta zihinsel bağ ve yalnız kalabileceğin alan istersin.", is: "Araştırma, bilim, analiz, maneviyat ve uzmanlık işlerinde derinsin.",
       yil: "İçe dönüş yılı: öğrenme, düşünme, ruhsal derinleşme. Dış başarıdan çok iç büyüme.", gun: "Bugün yalnız kalıp düşün; sezgini dinle." }
  8: { ad: "Sekiz", anahtar: "güç, başarı, maddi dünya",
       portre: "Sekiz, yöneten sayıdır: hırslı, güçlü, maddi dünyada başarılı.", golge: "Gölgesi aşırı kontrol ve işkoliklik.",
       ask: "Aşkta güçlü ve saygı duyduğun bir partner istersin.", is: "Yönetim, finans, iş kurma ve otorite gerektiren işlerde başarılısın.",
       yil: "Hasat ve güç yılı: kariyer ve para konularında sonuç alma zamanı.", gun: "Bugün para ve iş konularında net kararlar ver." }
  9: { ad: "Dokuz", anahtar: "tamamlanma, şefkat, evrensellik",
       portre: "Dokuz, tamamlayan sayıdır: cömert, idealist, insanlığa dönük.", golge: "Gölgesi geçmişe takılmak ve kendini feda etmek.",
       ask: "Aşkta derin, anlamlı ve bağışlayıcı bir bağ ararsın.", is: "Sanat, sosyal çalışma, eğitim ve insanlara hizmet eden işlerde anlam bulursun.",
       yil: "Kapanış yılı: dokuz yıllık döngü bitiyor. Bırak, temizle, affet; yeni döngüye yer aç.", gun: "Bugün bir şeyi bitir, bir şeyi bırak." }
  11: { ad: "On bir (usta)", anahtar: "ilham, sezgi, aydınlatma",
        portre: "On bir usta sayıdır: güçlü sezgi, ilham verme yeteneği ve yüksek hassasiyet. İkinin derin hâli.", golge: "Gölgesi sinirsel gerginlik ve kendinden şüphe.",
        ask: "Aşkta ruhsal bir bağ ararsın; yüzeysellik seni yorar.", is: "İlham veren, öğreten, rehberlik eden işlerde parlarsın.",
        yil: "", gun: "" }
  22: { ad: "Yirmi iki (usta)", anahtar: "usta inşaatçı, büyük vizyon",
        portre: "Yirmi iki usta inşaatçıdır: büyük hayalleri somut yapılara dönüştürme gücü. Dördün derin hâli.", golge: "Gölgesi baskı altında ezilmek ve mükemmeliyetçilik.",
        ask: "Aşkta birlikte bir şey inşa edebileceğin bir partner istersin.", is: "Büyük projeler, kurumlar, kalıcı eserler kurma gücün var.",
        yil: "", gun: "" }
  33: { ad: "Otuz üç (usta)", anahtar: "usta öğretmen, şefkat",
        portre: "Otuz üç usta öğretmendir: koşulsuz şefkat ve iyileştirme gücü. Altının derin hâli.", golge: "Gölgesi kendini unutacak kadar başkalarına vermek.",
        ask: "Aşkta derin bir bağlılık ve şefkat taşırsın.", is: "Şifa, eğitim ve insanlara hizmette olağanüstü bir etkin olabilir.",
        yil: "", gun: "" }
