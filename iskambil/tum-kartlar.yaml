kaynak: "İskambil falı (katina) geleneği; metin özgün"
lang: tr
# Elli iki kartın her biri için ayrı yorum.
kartlar:
  kupa-1: "Kupa ası: evde sevinç, aşkta yeni bir sayfa; gönlün açılıyor."
  kupa-2: "Kupa ikilisi: karşılıklı bir sevgi, iki gönlün buluşması; bir davet ya da tanışma."
  kupa-3: "Kupa üçlüsü: sevinçli bir haber, kutlama; ama araya üçüncü bir kişi girebilir, gözünü açık tut."
  kupa-4: "Kupa dörtlüsü: evde huzur, ama biraz durgunluk; ilişkiye taze bir soluk lazım."
  kupa-5: "Kupa beşlisi: duygusal bir dalgalanma; kıskançlık ya da küçük bir kırgınlık geçecek."
  kupa-6: "Kupa altılısı: eski bir dosttan haber, geçmişten tatlı bir anı; kısa bir aile ziyareti."
  kupa-7: "Kupa yedilisi: hayaller ve vaatler; tutulmayabilecek bir söz, ölçülü umut et."
  kupa-8: "Kupa sekizlisi: misafir, davet, sofra; evde kalabalık ve neşe."
  kupa-9: "Kupa dokuzlusu: dilek kartı; içinden geçen olacak."
  kupa-10: "Kupa onlusu: ailede mutluluk, dileğin gerçekleşmesi; katinada en hayırlı kartlardan."
  kupa-11: "Kupa valesi: genç ve sevecen biri, gönül işleriyle ilgili bir haber getiriyor."
  kupa-12: "Kupa kızı: sevecen, sıcak bir kadın; soran kadınsa onun kartı da olabilir."
  kupa-13: "Kupa papazı: iyi niyetli, sevecen bir erkek; soran erkekse onun kartı da olabilir."
  karo-1: "Karo ası: bir mektup, bir haber, bir para müjdesi."
  karo-2: "Karo ikilisi: küçük bir para işi, bir anlaşma ya da beklenmedik bir mesaj."
  karo-3: "Karo üçlüsü: resmi bir iş, yazışma; belge ve imza zamanı."
  karo-4: "Karo dörtlüsü: kısa bir yolculuk ya da işle ilgili bir değişiklik."
  karo-5: "Karo beşlisi: iş başarısı, kazançlı bir girişim; para yolunda."
  karo-6: "Karo altılısı: iş yerinde küçük bir anlaşmazlık; sözlerine dikkat."
  karo-7: "Karo yedilisi: dedikodu ya da hesapta küçük bir karışıklık; belgeleri kontrol et."
  karo-8: "Karo sekizlisi: yeni bir yolculuk, yeni bir iş; hareketli günler."
  karo-9: "Karo dokuzlusu: yeni bir iş ya da maddi bir sürpriz."
  karo-10: "Karo onlusu: para, yolculuk ya da iş için büyük bir değişim."
  karo-11: "Karo valesi: bir haberci, iş için gelen bir genç ya da önemli bir telefon."
  karo-12: "Karo kızı: girişken, sosyal bir kadın; işinde ya da çevrende etkili."
  karo-13: "Karo papazı: iş insanı, para işlerinde söz sahibi bir erkek."
  sinek-1: "Sinek ası: emeğin karşılığı, başarı ve güçlü bir destek."
  sinek-2: "Sinek ikilisi: bir engel ya da bekleyiş; ama yardım eden biri var."
  sinek-3: "Sinek üçlüsü: ikinci bir şans, yeni bir ortaklık; bazen evlilik teklifi."
  sinek-4: "Sinek dörtlüsü: dostlardan destek; ama bir sırrın sana açılması da olabilir."
  sinek-5: "Sinek beşlisi: yeni bir dost ya da yararlı bir tanışma."
  sinek-6: "Sinek altılısı: iş birliği, ortak bir proje; maddi yardım."
  sinek-7: "Sinek yedilisi: küçük bir kazanç; ama karşı cinsle ilgili bir uyarı."
  sinek-8: "Sinek sekizlisi: aceleci bir istek; dikkatli ol, başkasının parasına göz dikme."
  sinek-9: "Sinek dokuzlusu: beklenmedik bir kazanç ya da bir dostun yardımı."
  sinek-10: "Sinek onlusu: bir yolculuk, bir taşınma ya da bolluk."
  sinek-11: "Sinek valesi: sadık bir genç, güvenilir bir dost."
  sinek-12: "Sinek kızı: güvenilir, zeki ve yardımsever bir kadın."
  sinek-13: "Sinek papazı: dürüst ve cömert bir erkek; iyi bir danışman."
  maca-1: "Maça ası: kesin bir karar, bir sınav; dikkat isteyen önemli bir dönem."
  maca-2: "Maça ikilisi: bir ayrılık ya da kararsızlık; seçim yapmak gerekiyor."
  maca-3: "Maça üçlüsü: bir kırgınlık ya da üçüncü bir kişi; konuşarak çöz."
  maca-4: "Maça dörtlüsü: dinlenme ihtiyacı; yorgunluk geçici."
  maca-5: "Maça beşlisi: bir engel ya da gecikme; sabırla aşılır."
  maca-6: "Maça altılısı: zorluktan yavaş yavaş çıkış; durum düzeliyor."
  maca-7: "Maça yedilisi: küçük bir üzüntü ya da kayıp; önemseme, geçecek."
  maca-8: "Maça sekizlisi: hayal kırıklığı ya da bir planın değişmesi; esnek ol."
  maca-9: "Maça dokuzlusu: kaygı, uykusuz geceler; ama endişenin çoğu gerçekleşmez."
  maca-10: "Maça onlusu: bir zorluğun sonu; dipten sonra yükseliş."
  maca-11: "Maça valesi: düşüncesiz bir genç ya da tatsız bir haber; aldırma."
  maca-12: "Maça kızı: kıskanç ya da soğuk bir kadın; ya da yalnızlık dönemi."
  maca-13: "Maça papazı: sert, kuralcı bir erkek; bir otorite ya da hukuk işi."
