kaynak: "I Ching çizgi sözleri (kamu malı klasik metin) temel alınarak yazılmış özgün Türkçe yorumlar; çeviri değildir"
lang: tr
cizgiler:
  49:
    - "Sarı öküz derisiyle sarılı: zamanı gelmeden değişime girişme."
    - "Gün geldiğinde değişim: ilerlemek şans, hata yok."
    - "Aceleyle değişim talihsizlik getirir; söz üç kez onaylanınca güven doğar."
    - "Pişmanlık kayboluyor: güvenle düzeni değiştirmek şans."
    - "Büyük adam kaplan gibi değişir: kehanet gerekmeden herkes güvenir."
    - "Yüce kişi leopar gibi değişir; küçük insan sadece yüzünü değiştirir. Aşırıya gitme."
  50:
    - "Kazan ters dönmüş: bayatı boşaltmak yararlı."
    - "Kazanda yemek var: kıskançlar dokunamaz, şans."
    - "Kazanın kulpu değişmiş: yağlı sülün yenmiyor; ama yağmur gelince pişmanlık geçer."
    - "Kazanın ayağı kırılmış: yükü kaldıramayan görev talihsizlik getirir. Gücünü bil."
    - "Sarı kulplar, altın halkalar: sebat avantaj."
    - "Yeşim halkalar: büyük şans, her şey uygun."
  51:
    - "Sarsıntı geliyor: önce korku, sonra gülüş. Şans."
    - "Sarsıntı tehlike getiriyor: hazineni bırak, dokuz tepeye çık; peşine düşme, yedi günde geri gelir."
    - "Sarsıntı sersemletiyor: sarsıntıyla hareket etmek felaketi önler."
    - "Sarsıntı çamura batıyor: enerji tıkandı."
    - "Sarsıntı gidip geliyor: tehlike var ama kayıp yok, yapılacak iş var."
    - "Sarsıntı çevredekileri vuruyor: sana dokunmadıysa şimdi hareket etme."
  52:
    - "Ayak parmaklarını durdurmak: başlamadan durmak hatasızdır."
    - "Baldırını durdurmak: takip ettiğini kurtaramıyorsun; yüreğin sıkkın."
    - "Kalçalarını durdurmak: zorla dinginlik içini yakar."
    - "Gövdesini durdurmak: hata yok."
    - "Çenesini durdurmak: sözler düzen bulur, pişmanlık kaybolur."
    - "Yüce dinginlik: şans."
  53:
    - "Yaban kazı kıyıya yaklaşıyor: genç insan tehlikede; ama hata yok."
    - "Kaz kayaya yaklaşıyor: yemek ve içecek huzurla, şans."
    - "Kaz yaylaya yaklaşıyor: adam gidip dönmüyor; sınırını bil."
    - "Kaz ağaca yaklaşıyor: düz dal bulursa hata yok."
    - "Kaz tepeye yaklaşıyor: üç yıl yalnızlık ama sonunda kimse engel olamaz."
    - "Kaz yükseklere yaklaşıyor: tüyleri törende kullanılır. Şans."
  54:
    - "Gelin ikincil eş olarak gidiyor: topal ama yürüyebilir. İlerlemek şans."
    - "Tek gözlü ama görebilir: yalnız yaşayanın sadakati."
    - "Hizmetçi olarak giden gelin: beklemek gerekir."
    - "Gelin vaktini aşıyor: gecikme ama zamanı gelecek."
    - "Prensesin giysisi hizmetçininkinden sade: ay doluya yakın, şans."
    - "Kadın sepet taşıyor ama içi boş: hiçbir şey avantajlı değil. Gösterişe aldanma."
  55:
    - "Eşit efendiyle karşılaşmak: on gün beraber olmak hata değil."
    - "Perde öyle kalın ki öğlen yıldızlar görünüyor: şüphe uyandırırsın; samimiyetle düzelt."
    - "Gölgelik öyle yoğun ki öğlen küçük yıldızlar görünüyor: sağ kolunu kırsan da hata yok."
    - "Perde kalın, öğlen yıldızlar: eşit efendiyle buluş, şans."
    - "Parlaklık geliyor: övgü ve şan, şans."
    - "Evi bolluk içinde ama ailesini perdeliyor: kapıdan bakınca ıssız. Kendini kapatma."
  56:
    - "Gezgin küçük işlerle uğraşıyor: kendi talihsizliğini çağırır."
    - "Gezgin hana geliyor, parası yanında, sadık bir hizmetkâr buluyor."
    - "Gezginin hanı yanıyor, hizmetkârı kaybediyor: tehlike."
    - "Gezgin bir sığınak buluyor: parası ve baltası var ama kalbi huzursuz."
    - "Sülünü bir okla vurmak: ok kaybolsa da sonunda övgü ve görev."
    - "Kuşun yuvası yanıyor: gezgin önce güler sonra ağlar. Kibirden sakın."
  57:
    - "İleri geri gitmek: askeri kararlılık gerekir."
    - "Yatağın altına nüfuz etmek: rahipler ve büyücüler; şans, hata yok."
    - "Tekrar tekrar nüfuz etmek: utanç."
    - "Pişmanlık kayboluyor: avda üç tür av yakalamak."
    - "Sebat şans getirir: başlangıç yok ama son var. Değişimden önce üç gün, sonra üç gün."
    - "Yatağın altına nüfuz etmek: malını ve baltasını kaybediyor. Aşırıya gitme."
  58:
    - "Uyumlu neşe: şans."
    - "İçten neşe: şans, pişmanlık kaybolur."
    - "Gelen neşe: dışarıdan gelen zevkler talihsizlik getirir."
    - "Neşeyi tartmak: huzursuzluk; hastalıktan uzak durursan sevinç."
    - "Çözülene güvenmek: tehlike."
    - "Çekici neşe: sürüklenmekten sakın."
  59:
    - "Güçlü bir atla yardıma koşmak: şans."
    - "Çözülme anında desteğine koşmak: pişmanlık kaybolur."
    - "Kendini çözmek: pişmanlık yok."
    - "Gruptan çözülmek: büyük şans; dağılmanın içinde bir tepe toplanıyor."
    - "Büyük çağrılar ter gibi akar: kralın evini dağıtmak hata değil."
    - "Kanından çözülmek, uzaklaşıp gitmek: hata yok."
  60:
    - "Avlunun kapısından çıkmamak: hata yok."
    - "Avlu kapısından çıkmamak: talihsizlik. Zamanı geldi, harekete geç."
    - "Sınır tanımamak: ağlarsın ama hata yok, kendi seçimin."
    - "Huzurlu sınırlama: başarı."
    - "Tatlı sınırlama: şans; ilerlemek takdir getirir."
    - "Acı sınırlama: sebat talihsizlik getirir; pişmanlık geçer."
  61:
    - "Hazır olmak şans; başka niyet huzursuzluk getirir."
    - "Gölgedeki turna öter, yavrusu cevap verir: içten bağ uzağa ulaşır."
    - "Bir eş bulmak: bazen davul çalar, bazen durur; bazen ağlar, bazen şarkı söyler."
    - "Ay neredeyse dolu: at eşini bırakıyor; hata yok."
    - "Samimiyetle bağlı: hata yok."
    - "Horoz göğe yükselmek istiyor: sebat talihsizlik getirir. Sözüne uygun yaşa."
  62:
    - "Kuş uçarak gelir: talihsizlik; şimdilik uçma."
    - "Atayı geçip büyükanneyle karşılaşmak: haddini bilmek hatayı önler."
    - "Aşırı önlem almazsan biri arkandan gelir: dikkat."
    - "Hata yok; karşılaşmak yerine geçmek. İlerlemek tehlikeli, uyanık ol."
    - "Batıdan yoğun bulutlar ama yağmur yok: prens mağaradaki kuşu vuruyor."
    - "Karşılaşmadan geçmek: uçan kuş uzaklaşıyor. Aşırılık felaket getirir."
  63:
    - "Tekerlekleri frenlemek, kuyruğu ıslatmak: hata yok."
    - "Kadın arabasının perdesini kaybediyor: arama, yedi günde bulursun."
    - "Yüce Ata, uzak Guifang ülkesini yeniyor: üç yıl sürer; küçük insanlara görev verme."
    - "En güzel giysiler paçavraya dönebilir: bütün gün tetikte ol."
    - "Doğudaki komşunun öküzü değil, batıdakinin küçük sunusu makbul: samimiyet esastır."
    - "Başını ıslatmak: tehlike. Bittiğini sandığın yerde dikkat et."
  64:
    - "Kuyruğunu ıslatmak: utanç; zamanı gelmeden atılma."
    - "Tekerlekleri frenlemek: sebat şans getirir."
    - "Tamamlanmadan önce ilerlemek talihsizlik; ama büyük nehri geçmek avantajlı."
    - "Sebat şans getirir, pişmanlık kaybolur: üç yıllık mücadeleden sonra ödül."
    - "Sebat şans; yüce kişinin ışığı samimidir. Şans."
    - "Kutlamada şarap içmek: hata yok; ama başını ıslatırsan ölçüyü kaybedersin."
