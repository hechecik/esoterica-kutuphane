kaynak: "I Ching çizgi sözleri (kamu malı klasik metin) temel alınarak yazılmış özgün Türkçe yorumlar; çeviri değildir"
lang: tr
cizgiler:
  17:
    - "Ölçütler değişiyor: kapıdan çıkıp farklı insanlarla tanışmak verimli olur."
    - "Küçük çocuğa tutunan, büyük adamı kaybeder. Kime bağlandığını seç."
    - "Büyük adama tutunup küçüğü bırakmak: aradığını bulursun; ama dürüst kal."
    - "Takip edilmek seni şımartabilir; niyetin temizse hata yok."
    - "İyiye içten bağlılık: şans."
    - "Bağlılık en üst düzeyde: sözüne sadık kalanı kimse yıkamaz."
  18:
    - "Babanın bozduğunu onarmak: tehlike var ama sonunda iyi."
    - "Annenin bozduğunu onarmak: sert olma, incelikle düzelt."
    - "Babanın bozduğunu onarırken biraz pişmanlık olur; büyük hata olmaz."
    - "Bozulanı hoş görmek: böyle devam edersen utanç gelir."
    - "Babanın bozduğunu onarmak övgü getirir."
    - "Krallara hizmet etmeden daha yüksek amaçlara yönelmek: kendi değerini koru."
  19:
    - "Birlikte yaklaşmak: azimle devam et, şans."
    - "Birlikte yaklaşmak: her şey yolunda gider."
    - "Tatlı sözlerle yaklaşmak işe yaramaz; fark ettiysen düzelt."
    - "Tam bir yaklaşma: içten açıklık hatasızdır."
    - "Bilgece yaklaşmak: bir lidere yakışır."
    - "Cömert yaklaşmak: şans, hata yok."
  20:
    - "Çocuk gibi bakmak: sıradan kişi için sorun değil, lider için ayıp."
    - "Kapı aralığından bakmak: sınırlı bir bakış açısı; geniş düşün."
    - "Kendi hayatına bakmak: ilerleyip gerilemeye karar vermek için önce kendini gör."
    - "Ülkenin ışığına bakmak: misafir olarak saygı görürsün."
    - "Kendi hayatını seyretmek: hatasız olmak için içine bak."
    - "Başkalarının hayatına bakarken kendi hayatını da sorgula."
  21:
    - "Ayağı köstekli: küçük bir ceza, büyük hatayı önler."
    - "Yumuşak eti ısırırken burun kayboluyor: biraz aşırı gittin ama hata değil."
    - "Kurumuş eti ısırıp zehre rastlamak: küçük bir sıkıntı, büyük zarar yok."
    - "Kemikli eti ısırıp altın ok bulmak: zorluk içinde azim, şans."
    - "Kuru eti ısırıp sarı altın bulmak: adil ve tutarlı ol."
    - "Kulakları kapanmış: uyarıları duymayan talihsizdir. Dinle."
  22:
    - "Ayaklarını süsleyip arabayı bırakıp yürümek: sadelik onurlu."
    - "Sakalını süslemek: süs kendi başına değer değil, öze bağlı."
    - "Süslü ve nemli: güzellik keyif verir ama kalıcı olan özdür."
    - "Beyaz bir at, kanatlı gibi: sadelik peşinde; gelen düşman değil, talip."
    - "Tepedeki bahçede zarafet: az ama içten bir sunu; sonunda şans."
    - "Beyaz süs: en yüce zarafet sadeliktir."
  23:
    - "Yatağın ayağı kırılıyor: temeller sarsılıyor. Dikkat."
    - "Yatağın kenarı kırılıyor: destek azalıyor; dayanıklı ol."
    - "Onlardan ayrılmak hata değil: çürüyen yapıdan uzak dur."
    - "Yatak kırılıyor, deriye ulaşıyor: zorluk yakın; korun."
    - "Balık dizisi gibi: saraydaki kadınlar gibi düzen kurarak lütuf kazan."
    - "Yenmemiş büyük meyve: iyi olan korunur, yeniden filizlenir."
  24:
    - "Çok uzaklaşmadan dönmek: pişmanlık yok, büyük şans."
    - "Sakin bir dönüş: şans."
    - "Tekrar tekrar dönmek: tehlikeli ama hata yok."
    - "Kalabalığın ortasında tek başına dönmek: doğruyu seçmek."
    - "Yüce gönüllü bir dönüş: pişmanlık yok."
    - "Dönüşü kaçırmak: talihsizlik; uzun süre ilerleyemezsin. Fırsatı kaçırma."
  25:
    - "Masum davranış: şans."
    - "Ekerken hasat düşünmemek, sürerken tarla hesaplamamak: işin kendisini yap."
    - "Masumken talihsizlik: birinin kaybı ötekinin kazancı olabilir. Kendine yükleme."
    - "Sebatla devam et: hata yok."
    - "Sebebi olmayan rahatsızlık: ilaçla değil, beklemekle geçer."
    - "Masum ama zamansız hareket: şimdi yapma."
  26:
    - "Tehlike var: durmak avantaj."
    - "Arabanın aksı söküldü: zorla ilerleme."
    - "İyi atlar birbirini takip ediyor: hedefin var ama günlük disiplini unutma."
    - "Genç boğanın boynuz kalkanı: tehlikeyi erkenden önlemek şans."
    - "Kısırlaştırılmış domuzun dişi: öfkeyi kökten dönüştürmek."
    - "Göğün yolu açık: büyük başarı."
  27:
    - "Kendi kaplumbağanı bırakıp başkasının ağzına bakmak: kendine güven."
    - "Tepeden beslenmek: doğru kaynak değil; bağımlılık zarar verir."
    - "Besinden yüz çevirmek: on yıl kaybedersin. Kendini doğru besle."
    - "Tepeden beslenmeyi aramak bir kaplan gibi: amaç doğruysa hata yok."
    - "Gelenekten sapmak: büyük nehri geçme, şimdilik dur."
    - "Beslenmenin kaynağı ol: zor ama şanslı; büyük nehri geç."
  28:
    - "Beyaz sazı yere sermek: aşırı özen bile hata değil."
    - "Kuru söğüt filiz veriyor: yaşlı adam genç eş buluyor; her şey yolunda."
    - "Kiriş çöküyor: inatla ilerlemek talihsizlik getirir."
    - "Kiriş desteklendi: şans; ama başka şeye güvenme."
    - "Kuru söğüt çiçek açıyor: geçici bir parlama, ne övgü ne yergi."
    - "Derinlikten geçmek, su başı aşıyor: zor ama ilkeli bir fedakârlık."
  29:
    - "Uçurumun içinde bir çukura düşmek: alışkanlığa dönüşen tehlike."
    - "Uçurumda tehlike: küçük hedeflerle yetin."
    - "İleri geri uçurum: harekete geçme, bekle."
    - "Bir testi şarap, bir kâse pirinç: sade bir samimiyet her şeyden değerli."
    - "Uçurum taşmıyor, sular çekiliyor: hata yok."
    - "Dikenli çalılarla bağlı: üç yıl çözüm yok. Sabırla öğren."
  30:
    - "Ayak izleri karışık: başlangıçta ciddiyet hatayı önler."
    - "Sarı ışık: ölçülü olmak büyük şans."
    - "Batan güneşin ışığı: yaşlanmayı kabullenip anı yaşamak."
    - "Ani parlayan ateş: çabuk yanan çabuk söner."
    - "Gözyaşı ve iç çekiş: üzüntü bilgeliğe dönüşüyor, şans."
    - "Kral sefere çıkar: kökü kes ama herkesi cezalandırma."
  31:
    - "Ayak parmağında etki: niyet var ama henüz görünmez."
    - "Baldırda etki: aceleyle hareket etme, bekle."
    - "Uyluğa etki: başkalarının peşinden koşma."
    - "Kalpten etki: sebatlı olan kazanır; kararsızlık yorar."
    - "Ensede etki: pişmanlık yok ama derin de değil."
    - "Çenede ve dilde etki: yalnızca sözle etkilemek boş kalır."
  32:
    - "Süreklilik hemen istenince yarım kalır."
    - "Pişmanlık kayboluyor: ölçülü kalan sürekli olur."
    - "Erdemde süreksizlik: utanç getirebilir."
    - "Tarlada av yok: yanlış yerde aramak."
    - "Karakterde süreklilik: yerine göre şans."
    - "Sürekli huzursuzluk: talihsizlik."
