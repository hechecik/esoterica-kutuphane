kaynak: "I Ching çizgi sözleri (kamu malı klasik metin) temel alınarak yazılmış özgün Türkçe yorumlar; çeviri değildir"
lang: tr
# Her heksagram için altı çizgi, alttan (1) üste (6).
cizgiler:
  1:
    - "Ejder henüz suyun derinliğinde: güç var ama zamanı gelmedi. Görünmeden hazırlan."
    - "Ejder tarlada beliriyor: yeteneğin fark ediliyor. Seni destekleyecek biriyle görüş."
    - "Gün boyu çalışıp gece de tetikte kalmak: yorucu ama hatasız bir dönem. Dikkatini gevşetme."
    - "Derinlikten sıçramaya hazır: atılmak ya da beklemek senin seçimin; ikisi de hata sayılmaz."
    - "Ejder gökte uçuyor: en güçlü an. Bu yüksekliği seninle aynı değerleri taşıyanlarla paylaş."
    - "Kibirli ejder pişman olur: doruğu aştın. Daha fazlasını isteme; biraz geri çekil."
  2:
    - "Ayağın altında kırağı: buz yakında. Küçük işaretleri ciddiye al; büyük şeyler küçük başlar."
    - "Düz, kare ve geniş: doğal olanı yapmak yeter. Zorlamadan iş kendiliğinden yürür."
    - "Yeteneğini gizli tut; birinin hizmetinde de olsan işi bitirmek senin onurun."
    - "Ağzı bağlı bir kese: konuşma zamanı değil. Ne övgü ne yergi; sessizlik korur."
    - "Sarı bir giysi: alçakgönüllü ama değerli bir duruş. Bu en büyük şans."
    - "Ejderler kırda savaşıyor: alıcı olanın haddini aşması çatışma doğurur. Yerini bil."
  3:
    - "Taş yolu kesiyor: duraksama. Sabırla dur ve yardımcı topla; acele etme."
    - "İleri geri giden atlar: teklif var ama vakti gelmedi. Bekleyiş on yıl sürse de doğru olanı bekle."
    - "Rehbersiz geyik avı ormanda kaybolur. Bilmediğin yola tek başına girme."
    - "Atlar geri dönüyor ama bu sefer birlik için: doğru ortaklığa evet de."
    - "Bereketi dağıtmakta zorluk: küçük adımlarla ilerle; büyük hamle şimdi tehlikeli."
    - "Gözyaşı akıyor, atlar duraksıyor: umutsuzlukta oyalanma. Bu hâl uzun sürmez."
  4:
    - "Toyu uyandırmak için biraz disiplin gerekir; ama zinciri fazla sıkma."
    - "Toyu şefkatle karşılamak: sabır ve hoşgörü iyi bir öğretmen yapar."
    - "Gözünü sadece parıltıya diken kişi kendini kaybeder. Görünüşe kapılma."
    - "Hayallerine sıkışmış toyluk utanç getirir. Gerçeklerle yüzleş."
    - "Çocuksu saflık: öğrenmeye açık olmak şans getirir."
    - "Toyluğu cezalandırmak değil, korumak gerekir. Hata yapana saldırma, hatayı önle."
  5:
    - "Kırda beklemek: tehlike uzakta. Gündelik düzenini koru, sabret."
    - "Kumda beklemek: biraz dedikodu çıkabilir ama sonunda iyi biter."
    - "Çamurda beklemek: kendin düşmanı çağırıyorsun. Dikkatli ol."
    - "Kanın içinde beklemek: zor bir durum. Çukurdan çık, akışa bırak."
    - "Şarap ve yemek başında beklemek: dinlen, gücünü topla; sonuç iyi."
    - "Çukura düştün ama üç beklenmedik misafir geliyor: onlara saygı göster, yardım edecekler."
  6:
    - "Meseleyi uzatma; küçük bir söz çıkar ama sonu iyi."
    - "Çekişmede kazanamazsın; geri çekil, evine dön. Kimse zarar görmez."
    - "Eski değerlerinle beslen. Başkasının işinde ün peşinde koşma."
    - "Çekişemezsin; geri dön, kaderine razı ol. Huzur bulursun."
    - "Adil bir hakeme başvurmak: büyük şans."
    - "Kazanılmış bir kemer üç kez geri alınır: kavgayla gelen onur kalıcı değil."
  7:
    - "Ordu düzenle yola çıkar; düzensizlik felaket getirir. Kurallarını koy."
    - "Ordunun ortasında komutan: güven kazanılmış. Takdir yolda."
    - "Ordu arabada yenilgiyi taşıyor: dağınık liderlik. Yetkiyi doğru kişiye ver."
    - "Ordu geri çekiliyor: hata değil, akıllıca bir karar."
    - "Tarlada av var: harekete geç. Ama yönetimi deneyimli olana bırak."
    - "Zafer sonrası ödüller: küçük ruhlu kişilere yetki verme."
  8:
    - "İçten bağlanmak: dolu bir kap gibi samimiyet. Beklenmedik şans gelir."
    - "Birliği içten sağlamak: kendi değerini kaybetmeden bağlan."
    - "Yanlış insanlarla birlik: dikkat et, kime bağlandığını sorgula."
    - "Dışarıdaki doğru kişiye bağlanmak: sadakat şans getirir."
    - "Kral avda üç yandan sürer, bir yanı açık bırakır: gelen gelsin, giden gitsin. Gönüllü birlik en güçlüsü."
    - "Başı olmayan birlik: geç kaldın ya da yönsüzsün. Talihsizlik."
  9:
    - "Kendi yoluna dönmek: kimse suçlayamaz. Şans."
    - "Başkalarıyla birlikte geri dönmek: doğru seçim."
    - "Araba tekerleğini kaybediyor; eşler arasında çekişme. Gücünü zorlama."
    - "Samimiyet korkuyu dağıtır; kan akmaz, endişe geçer."
    - "İçten bağlılık komşunu da zenginleştirir."
    - "Yağmur yağdı, dinlenme vakti: elde edileni koru; daha fazlasına zorlama."
  10:
    - "Sade bir yürüyüş: basit davranmak hatasızdır."
    - "Düz ve kolay bir yol: yalnız yürüyen sakin kişi için şans."
    - "Tek gözüyle görüp yürümeye kalkan, kaplanın kuyruğuna basar. Gücünü abartma."
    - "Kaplanın kuyruğuna basıyorsun ama dikkatlisin: sonunda iyi olacak."
    - "Kararlı yürüyüş: haklısın ama tehlikenin farkında ol."
    - "Yürüdüğün yola bak, işaretleri incele: tamamlanma şans getirir."
  11:
    - "Kökleriyle sökülen saz: biri ilerleyince diğerleri de gelir. Şans."
    - "Kaba olanı da kabullen, ırmağı yürüyerek geç, uzaktakini unutma: orta yol."
    - "Düzlük yokuşsuz olmaz, gidiş dönüşsüz olmaz. Değişime hazır ol, sadakatini koru."
    - "Zenginliği gösterişe dökmeden komşularla paylaş; içten bağlılık."
    - "Kralın kızını evlendirmesi: alçakgönüllülükle gelen büyük şans."
    - "Sur hendeğe çöküyor: barış dönemi bitiyor. Ordu çağırma; sadece kendi çevreni koru."
  12:
    - "Kökleriyle sökülen saz: kötü günlerde doğru insanlarla birlikte geri çekil."
    - "Sabır ve hizmet; büyük insan durgunluğa boyun eğmez."
    - "Utanç taşımak: yanlış yerde kazanılan şey içini kemirir."
    - "Göğün emriyle hareket eden hatasızdır; yanındakiler de güç bulur."
    - "Durgunluk duruyor: dikkatli ol; bir dut ağacına bağla kendini."
    - "Durgunluk devriliyor: önce durgunluk, sonra sevinç."
  13:
    - "Kapıda insanlarla dostluk: herkese açık birlik. Hata yok."
    - "Sadece kendi klanınla dostluk: dar görüşlülük pişmanlık getirir."
    - "Silahları çalılıklarda saklamak: üç yıl kalkamazsın. Güvensizlik yorar."
    - "Sura tırmanıyor ama saldıramıyor: geri adım atmak şans."
    - "Önce ağlayıp sonra gülmek: ayrılık bitince büyük birlik."
    - "Kırlarda dostluk: pişmanlık yok ama tam birlik de yok."
  14:
    - "Zararlı olanla bağ kurma; zorluğun bilincinde olmak hatayı önler."
    - "Büyük bir araba yüklü: gidecek yer var, kaynağın yeterli."
    - "Bir prens sunuyu yalnızca göğe yapar; küçük insan yapamaz. Varlığını kamuya hizmet için kullan."
    - "Gösterişten uzak durmak: hata yok."
    - "Samimiyetin hem ılımlı hem saygın: şans."
    - "Gökten gelen yardım: her şey yolunda."
  15:
    - "Alçakgönüllü olan büyük nehri geçer: şans."
    - "Kendini gösteren alçakgönüllülük: doğal bir saygınlık."
    - "Emekle gelen alçakgönüllülük: sonunda şans."
    - "Alçakgönüllülüğü gösterişe çevirme; doğal olsun."
    - "Komşularını zenginleştirmeden de güç kullanmak gerekebilir; haklıysan ilerle."
    - "Ünlenmiş alçakgönüllülük: ordunu kendi şehrini düzenlemek için kullan."
  16:
    - "Coşkusunu ilan eden talihsizdir: sevincini sessiz taşı."
    - "Taş kadar sağlam: günü dolmadan durmayı bilmek şans."
    - "Yukarı bakarak coşmak pişmanlık getirir; tereddüt de pişmanlık getirir."
    - "Coşkunun kaynağı sensin: şüphe etme, dostlar toplanır."
    - "Uzun süren bir sıkıntı ama yıkılmıyorsun: baskı altında ayakta kalıyorsun."
    - "Kör coşku: ama şimdi uyanırsan hata yok."
