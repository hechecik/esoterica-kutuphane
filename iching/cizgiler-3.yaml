kaynak: "I Ching çizgi sözleri (kamu malı klasik metin) temel alınarak yazılmış özgün Türkçe yorumlar; çeviri değildir"
lang: tr
cizgiler:
  33:
    - "Çekilmenin kuyruğu: tehlikeli. Şimdi bir şeye girişme."
    - "Sarı öküz derisiyle bağlı: sağlam bir bağlılık, kimse çözemez."
    - "Bağlı çekilme: zor; bağlarını azalt."
    - "İsteyerek çekilmek: güçlü kişi için şans, zayıf için kayıp."
    - "Dostça çekilme: sebat şans getirir."
    - "Neşeli çekilme: her şey yolunda."
  34:
    - "Ayak parmaklarında güç: ilerlemek talihsizlik getirir."
    - "Sebat şans getirir."
    - "Küçük insan gücünü kullanır, büyük insan kullanmaz. Keçi çite takılır."
    - "Çit açılıyor, büyük arabanın aksları sağlam: ilerle."
    - "Keçiyi kolayca kaybetmek: pişmanlık yok."
    - "Keçi çite takılı: ne ileri ne geri. Zorluğu anlamak şans."
  35:
    - "İlerliyor ama geri itiliyor: güvenilmesen de sakin kal."
    - "İlerleme ama kederle: büyükanneden gelen bir lütuf var."
    - "Herkes onaylıyor: pişmanlık yok."
    - "Kunduz gibi ilerlemek: açgözlülük tehlikeli."
    - "Kazanç ve kaybı dert etme: her şey yolunda."
    - "Boynuzlarla ilerlemek: yalnızca kendi şehrini düzenlemek için kullan."
  36:
    - "Kanatları düşük uçmak: yolda aç kalsan da ilkeden vazgeçme."
    - "Sol uyluğundan yaralı: güçlü bir atla kurtarmak şans."
    - "Güneyde avda büyük önderi yakalamak: ama acele etme."
    - "Karanlığın kalbine girip çıkmak: durumu anladın, uzaklaş."
    - "Prens Ji'nin ışığını gizlemesi: sebat şans getirir."
    - "Işık değil karanlık: önce göğe çıktı, sonra yere düştü."
  37:
    - "Aile içinde sağlam kurallar: pişmanlık kaybolur."
    - "İçeride yemek hazırlamak: görevini yerine getirmek şans."
    - "Aile içinde sertlik ve neşe dengesi: aşırı sertlik ya da laubalilik sorun yaratır."
    - "Ailenin zenginliği: büyük şans."
    - "Kral ailesine yaklaşıyor: korkmaya gerek yok, şans."
    - "Samimiyet ve saygınlık: sonunda şans."
  38:
    - "Atını kaybetme, peşinden koşma; kendi gelir."
    - "Efendiyle dar sokakta karşılaşmak: hata yok."
    - "Arabası çekiliyor, öküzü duruyor: başlangıç kötü ama son iyi."
    - "Yalnız ve karşıtlık içinde güvenilir biriyle tanışmak: hata yok."
    - "Akraba ısırıyor: geçici bir kırgınlık; ilerlemek hata değil."
    - "Yalnızlık ve şüphe: domuz gibi görünen dost çıkıyor. Önyargını bırak."
  39:
    - "Gitmek engel, gelmek övgü: geri dur."
    - "Kralın hizmetkârı engel üstüne engelle karşılaşıyor: kendi suçu değil."
    - "Gitmek engel, geri dönmek iyi."
    - "Gitmek engel, gelmek birlik getirir."
    - "Büyük engel ortasında dostlar geliyor."
    - "Gitmek engel, gelmek büyük şans: büyük insanı görmek yararlı."
  40:
    - "Hata yok."
    - "Tarlada üç tilki yakalanır, sarı ok kazanılır: sebat şans."
    - "Sırtında yük taşırken arabaya binmek: hırsız çeker. Gösterişten kaçın."
    - "Ayak başparmağını kurtar: dost gelir ve güvenir."
    - "Ancak yüce kişi kurtarabilir: küçük insanlar da bunu görür."
    - "Prens yüksek surdaki şahini vurur: her şey yolunda."
  41:
    - "İşini bitirince hızla gitmek: ne kadar azaltacağını tart."
    - "Sebat avantaj; ilerlemek talihsizlik. Kendini azaltmadan diğerini artır."
    - "Üç kişi yürürken biri eksilir; tek başına giden bir dost bulur."
    - "Hatayı azaltmak hızla sevinç getirir."
    - "On çift kaplumbağa kabuğu reddedilemez: büyük şans."
    - "Kendini azaltmadan diğerlerini artırmak: hata yok, ilerle."
  42:
    - "Büyük işler yapmak yararlı: büyük şans, hata yok."
    - "On çift kaplumbağa kabuğu: sebat sonsuz şans."
    - "Kötü durumlardan kazanç: hata yok, eğer samimiysen."
    - "Orta yolda yürüyerek prensi ikna etmek: başkent taşınabilir."
    - "İçten bir kalp: soru sormaya gerek yok, büyük şans."
    - "Kimseye yardım etmemek: kalbin kararsız, talihsizlik."
  43:
    - "Ayak parmaklarında güç: başaramayacağın işe girişme."
    - "Gece endişeyle çağırmak: silahlar olsa da korkma."
    - "Yüzünde güç: talihsizlik, ama tek başına yürüyen kararlıdır."
    - "Kalçasında deri yok: dinlemezsen pişman olursun."
    - "Yabani otu söküp atmak: ortada kalmak hata değil."
    - "Çığlık yok: sonunda talihsizlik; uyarıyı ihmal etme."
  44:
    - "Bakır frenle durdur: kötülük kontrol edilmeli."
    - "Torbada balık var: hata yok ama misafire verme."
    - "Kalçasında deri yok: zor yürüyüş, ama büyük hata yok."
    - "Torbada balık yok: talihsizlik başlıyor."
    - "Söğüt dalı altında kavun: gizli yetenek gökten gelir."
    - "Boynuzlarıyla karşılaşmak: pişmanlık ama hata değil."
  45:
    - "Samimiyet var ama sonuna kadar değil: bir çağrı, bir tokalaşma, gülümsemek. Hata yok."
    - "Çekilmeye izin vermek: şans; küçük sunu da makbuldür."
    - "Toplanıp iç çekmek: biraz utanç ama hata yok."
    - "Büyük şans: hata yok."
    - "Konumla toplanmak: güven henüz yok; sebat pişmanlığı giderir."
    - "Ağlayıp iç çekmek: hata yok."
  46:
    - "Güvenle yükselmek: büyük şans."
    - "Samimiyetle küçük sunu: hata yok."
    - "Boş bir şehre çıkmak: engelsiz yükseliş."
    - "Kral dağda sunu yapar: şans."
    - "Basamak basamak yükselmek: sebat şans getirir."
    - "Karanlıkta yükselmek: aralıksız sebat gerekir."
  47:
    - "Ağaç kütüğünde oturmak, karanlık vadiye girmek: üç yıl göremezsin. Moralini topla."
    - "Şarap ve yemekte bunalım: kırmızı giysili adam geliyor, sabret."
    - "Taşa dayanmak, dikenlere tutunmak: kendi zorladığın bir sıkıntı."
    - "Yavaş geliyor, altın arabayla sıkışmış: utanç ama sonuç var."
    - "Yukarıdan da aşağıdan da sıkıştırılmış: ama yavaşça sevinç gelir."
    - "Sarmaşıklara takılmış: hareket edersen pişman olursun; ama pişmanlık da yol açar."
  48:
    - "Çamurlu kuyudan içilmez: eski kaynak kurumuş."
    - "Kuyu deliğinden balık vurmak: kova sızıyor, yeteneğin boşa gidiyor."
    - "Temiz kuyu ama kimse içmiyor: kalbim sızlıyor; değerini gösterecek birini bul."
    - "Kuyu taşlarla döşeniyor: hazırlık zamanı, hata yok."
    - "Kuyu berrak, serin kaynak: herkes içebilir."
    - "Kuyu üstü açık: herkese hizmet ediyor, büyük şans."
  # Not: çizgi metinleri olumsuz kehanet değil, durumu anlatan imgelerdir.
