  - { key: firtina, ad: "Fırtına", gelenek: "Telaş ve fitne; geçince ferahlık.", ic: "Kontrol edemediğin bir değişim ya da içindeki karmaşa." }
  - { key: sis, ad: "Sis", es: [duman], gelenek: "Belirsiz bir iş; açılınca hayır.", ic: "Netlik eksikliği; karar vermeden önce beklemek iyi olur." }
