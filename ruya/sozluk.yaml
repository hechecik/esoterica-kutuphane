kaynak: "Türk-İslam halk rüya tabiri geleneği ve modern rüya psikolojisi genel kavramları; metin özgün, kitaptan kopya değildir"
lang: tr
# gelenek: halk tabiri; ic: rüyanın sana dair olası psikolojik okuması
giris:
  - "Rüyalar gün içinde işlediğin duyguların gece dili. Burada iki okuma var: geleneğin tabiri ve rüyanın sana içeriden ne söylüyor olabileceği."
  - "Geleneğe göre rüya bir işaret; psikolojiye göre bir ayna. İkisini de okuyalım, sana hangisi dokunuyorsa onu tut."
kapanis:
  - "Rüyayı en iyi yorumlayan, onu gören kişidir: hangi his kaldıysa, asıl mesaj odur."
  - "Bir rüya kehanet değildir; seni neyin meşgul ettiğini gösterir."
duygu:
  korku: "Rüyada korku hissettiysen, uyanıkken kaçındığın bir mesele seni bekliyor olabilir."
  mutluluk: "Rüyada mutluysan, içinde bir şey yerine oturuyor; o hissi gün içine taşı."
  huzun: "Rüyada hüzün varsa, yasını tutmadığın bir kayıp ya da değişim olabilir."
  ofke: "Rüyada öfke varsa, dile getirmediğin bir sınır ihlali olabilir."
  saskinlik: "Rüyada şaşkınlık varsa, bir değişimin henüz adını koymadın."
  notr: "Rüyanın duygusu belirsizse, sembollere bak; onlar anlatıyor."
semboller:
  - { key: su, ad: "Su", es: [deniz, nehir, göl], gelenek: "Berrak su ferahlık, helal kazanç ve huzurdur; bulanık su sıkıntı.", ic: "Su duyguların akışıdır: suyun hâli, duygularının hâli." }
  - { key: deniz, ad: "Deniz", es: [okyanus, dalga], gelenek: "Durgun deniz devlet ve bereket, dalgalı deniz karmaşık işler.", ic: "Uçsuz bucaksız bir duygu ya da bilinçaltının derinliği; dalgalar içindeki çalkantı." }
  - { key: yagmur, ad: "Yağmur", gelenek: "Rahmet, bereket ve kısmet; derdin yıkanması.", ic: "Arınma ve rahatlama ihtiyacı; tutulan gözyaşları da olabilir." }
  - { key: sel, ad: "Sel", gelenek: "Ani bir değişim ya da kontrol edilemeyen bir olay.", ic: "Seni bastıran yoğun duygular; taşmak üzere olan bir yük." }
  - { key: kar, ad: "Kar", gelenek: "Kışta görülürse bereket, mevsimsizse soğuk bir haber.", ic: "Donmuş duygular, sessizlik ya da temiz bir sayfa." }
  - { key: ates, ad: "Ateş", es: [alev, yangın], gelenek: "Kontrollü ateş ısınma ve bereket; yangın fitne.", ic: "Tutku, öfke ya da dönüşüm; neyin yandığına bak." }
  - { key: ruzgar, ad: "Rüzgâr", es: [fırtına], gelenek: "Hafif rüzgâr müjde, fırtına telaş.", ic: "Değişim hissi; kontrol edemediğin şeyler." }
  - { key: gunes, ad: "Güneş", gelenek: "Devlet, makam, büyük bir şahıs ya da baba.", ic: "Bilinç, netlik ve kendini göstermek." }
  - { key: ay, ad: "Ay", es: [dolunay, hilal], gelenek: "Güzel bir eş, iyi bir dost ya da şöhret.", ic: "Sezgi, dişil yan ve gizli duygular." }
  - { key: yildiz, ad: "Yıldız", gelenek: "Değerli insanlar, ilim ve şeref.", ic: "Umut, hedef ve ilham." }
  - { key: gokyuzu, ad: "Gökyüzü", gelenek: "Yükseklik, dileklerin kabulü.", ic: "Özgürlük ve sınırsız olasılık hissi." }
  - { key: dag, ad: "Dağ", gelenek: "Büyük bir hedef, güçlü bir kişi; tırmanmak murada ermek.", ic: "Aşmaya çalıştığın engel ya da ulaşmak istediğin hedef." }
  - { key: orman, ad: "Orman", gelenek: "Kalabalık bir topluluk ya da bereket.", ic: "Bilinmeyen, keşfedilmemiş iç dünya." }
  - { key: agac, ad: "Ağaç", gelenek: "Ömür, aile ve nesil; meyveli ağaç hayırlı bir insan.", ic: "Büyüme, köklenme ve kimlik." }
  - { key: cicek, ad: "Çiçek", es: [gül], gelenek: "Sevinç, iyi söz ve güzel bir haber.", ic: "Açılma, güzellik ve kendini ifade etme." }
  - { key: meyve, ad: "Meyve", gelenek: "Mevsiminde helal kazanç, emeğin karşılığı.", ic: "Bir çabanın sonucunu görme isteği." }
  - { key: toprak, ad: "Toprak", es: [çamur], gelenek: "Mal ve rızık; çamur sıkıntı.", ic: "Topraklanma ihtiyacı ya da saplanıp kalma hissi." }
  - { key: yol, ad: "Yol", gelenek: "Düz yol doğru iş, dolambaçlı yol zahmetli iş.", ic: "Hayattaki yönün ve seçimlerin." }
  - { key: kopru, ad: "Köprü", gelenek: "Bir geçiş, bir ihtiyacın giderilmesi.", ic: "Bir dönemden diğerine geçiş." }
  - { key: ev, ad: "Ev", gelenek: "Kişinin kendisi, ailesi ve hâli; yeni ev yeni dönem.", ic: "Ev senin benliğindir; odalar zihninin bölümleri." }
  - { key: oda, ad: "Gizli oda", gelenek: "Keşfedilecek bir nimet.", ic: "Kendinin henüz tanımadığın bir yanı, keşfedilmemiş bir potansiyel." }
  - { key: kapi, ad: "Kapı", gelenek: "Açık kapı kısmet, kapalı kapı engel.", ic: "Fırsatlar ve geçişler; kapıyı açıp açmaman." }
  - { key: merdiven, ad: "Merdiven", gelenek: "Çıkmak yükselmek, inmek alçalmak.", ic: "Statü ve ilerleme kaygısı." }
  - { key: asansor, ad: "Asansör", gelenek: "Hızlı yükseliş ya da düşüş.", ic: "Kontrolün sende olmadığı bir değişim." }
  - { key: okul, ad: "Okul", es: [sınıf, sınav], gelenek: "İlim, öğrenme ve bir imtihan.", ic: "Yeterli olup olmadığın kaygısı; değerlendirilme hissi." }
  - { key: sinav, ad: "Sınav", gelenek: "Bir imtihan, başarıyla verilirse kurtuluş.", ic: "Performans kaygısı; kendini kanıtlama baskısı. Özellikle sınav dönemlerinde çok görülür." }
  - { key: hastane, ad: "Hastane", gelenek: "Bir sıkıntıdan kurtuluşa geçiş.", ic: "İyileşme ihtiyacı; kendine bakım." }
  - { key: dugun, ad: "Düğün", gelenek: "Bazen sevinç, bazen tersine tabir edilir; rüyadaki havaya bak.", ic: "Birleşme, yeni bir bağlılık ya da büyük bir değişim." }
  - { key: gelinlik, ad: "Gelinlik", gelenek: "Murada ermek, yeni bir hayat.", ic: "Bir role ya da bağlılığa hazırlık." }
  - { key: bebek, ad: "Bebek", gelenek: "Yeni bir iş, bir müjde ya da sorumluluk.", ic: "Yeni bir fikir, proje ya da kendi kırılgan yanın." }
