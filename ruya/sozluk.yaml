  - { key: anne, ad: "Anne", gelenek: "Dua, bereket ve hayırlı haber.", ic: "Şefkat, bakım ihtiyacı ya da annenle ilişkin." }
  - { key: baba, ad: "Baba", gelenek: "Destek, akıl ve koruma.", ic: "Otorite, kurallar ya da babanla ilişkin." }
