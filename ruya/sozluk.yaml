  - { key: sevgili, ad: "Sevgili / eş", gelenek: "Eşin hâli kişinin kendi hâlidir.", ic: "İlişkideki güven ya da kaygı; çoğu zaman gün içindeki düşüncelerin yansıması." }
  - { key: yabanci, ad: "Yabancı biri", gelenek: "Düşman ya da dost, tavrına göre.", ic: "Tanımadığın, kabul etmediğin bir yanın." }
