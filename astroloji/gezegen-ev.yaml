kaynak: "Esoterica astroloji kütüphanesi; metin özgün"
lang: tr
evler:
  1: { ad: "Benlik evi", alan: "kişilik, beden, ilk izlenim, hayata yaklaşım" }
  2: { ad: "Değerler evi", alan: "para, kaynaklar, öz değer, sahip olunanlar" }
  3: { ad: "İletişim evi", alan: "konuşma, yazı, kardeşler, yakın çevre, kısa yolculuklar, okul" }
  4: { ad: "Yuva evi", alan: "ev, aile, kökler, iç dünya, hayatın temeli" }
  5: { ad: "Yaratıcılık evi", alan: "aşk, keyif, çocuklar, oyun, sanat, kendini ifade" }
  6: { ad: "Hizmet evi", alan: "günlük iş, rutin, sağlık alışkanlıkları, iş arkadaşları" }
  7: { ad: "Ortaklık evi", alan: "evlilik, ortaklıklar, sözleşmeler, açık rakipler" }
  8: { ad: "Dönüşüm evi", alan: "ortak para, miras, kriz, mahremiyet, derin bağlar" }
  9: { ad: "Ufuk evi", alan: "yüksek eğitim, inanç, felsefe, uzak yolculuk, yayın" }
  10: { ad: "Kariyer evi", alan: "meslek, statü, toplumdaki yer, hedefler, otorite" }
  11: { ad: "Topluluk evi", alan: "dostlar, gruplar, umutlar, gelecek planları" }
  12: { ad: "Gizli ev", alan: "bilinçaltı, yalnızlık, maneviyat, gizli kalan şeyler, şifa" }
gezegenler:
  gunes:
    1: ["Güneş 1. evde: kendini saklamazsın; kişiliğin güçlü ve görünür. Hayata öncü bir enerjiyle girersin."]
    2: ["Güneş 2. evde: kimliğin değerlerin ve kazandıklarınla bağlı. Kendi kaynaklarını kurmak sana güç verir."]
    3: ["Güneş 3. evde: parladığın yer iletişim. Konuşmak, yazmak, öğretmek ve çevrenle bağ kurmak seni canlandırır."]
    4: ["Güneş 4. evde: özünün merkezi yuva ve aile. Hayatın ikinci yarısında kendi köklerini kurmak önem kazanır."]
    5: ["Güneş 5. evde: yaratıcılık, aşk ve oyun senin sahnen. Kalpten yaptığın her şeyde parlarsın."]
    6: ["Güneş 6. evde: kendini işe yarar olmakla tanımlarsın. Günlük düzen, iş ve sağlık senin için kimlik meselesi."]
    7: ["Güneş 7. evde: kendini ilişkiler aracılığıyla tanırsın. Ortaklıklar hayatının merkezinde."]
    8: ["Güneş 8. evde: hayatın derin sularında yüzersin. Krizler, dönüşümler ve mahrem bağlar seni şekillendirir."]
    9: ["Güneş 9. evde: anlam arayışı kimliğinin merkezi. Yolculuk, eğitim ve felsefe seni büyütür."]
    10: ["Güneş 10. evde: kariyer ve toplumdaki yerin kimliğinin ta kendisi. Görünür olmak ve bir şey başarmak istersin."]
    11: ["Güneş 11. evde: dostlar, topluluk ve gelecek hayalleri seni tanımlar. Grupla birlikteyken parlarsın."]
    12: ["Güneş 12. evde: ışığın içeriden yanar. Yalnızlık, maneviyat ve görünmeyen hizmetler sana anlam verir."]
  ay:
    1: ["Ay 1. evde: duyguların yüzüne yansır. Hassasiyetin ilk bakışta fark edilir."]
    2: ["Ay 2. evde: duygusal güvenliğin maddi güvenliğe bağlı. Birikim seni sakinleştirir."]
    3: ["Ay 3. evde: duygularını konuşarak anlarsın. Kardeşler ve yakın çevre duygusal dayanakların."]
    4: ["Ay 4. evde, doğal yerinde: ev ve aile ruhunun limanı. Köklerine derin bağlısın."]
    5: ["Ay 5. evde: duygularını yaratıcılıkla ifade edersin. Çocuklar ve keyif ruhunu besler."]
    6: ["Ay 6. evde: duygusal dengen günlük rutinine bağlı. Stres doğrudan bedenine yansır."]
    7: ["Ay 7. evde: duygusal güvenliği ilişkilerde ararsın. Yalnızlık sana zor gelebilir."]
    8: ["Ay 8. evde: duyguların derin ve yoğun. Mahrem bağlar ve dönüşümler ruhunu şekillendirir."]
    9: ["Ay 9. evde: ruhun uzaklara özlem duyar. İnanç ve yolculuk duygusal olarak besleyicidir."]
    10: ["Ay 10. evde: duyguların kamusal hayatına yansır. İnsanlarla ilgili, bakım veren işlerde başarılı olursun."]
    11: ["Ay 11. evde: dostların ailen gibidir. Topluluk içinde duygusal güvenlik bulursun."]
    12: ["Ay 12. evde: duygularını saklarsın; iç dünyan zengin ve derin. Yalnız kalmak şarj olmaktır."]
  merkur:
    1: ["Merkür 1. evde: zekân ve konuşman kişiliğinin önünde. Meraklı ve hareketli görünürsün."]
    2: ["Merkür 2. evde: para kazanma yolun zihin ve iletişim. Ticaret ve fikir satma yeteneğin var."]
    3: ["Merkür 3. evde, doğal yerinde: iletişim, yazı ve öğrenme senin alanın."]
    4: ["Merkür 4. evde: evde çok konuşulur; evden çalışma ya da aile içi iletişim önemli bir tema."]
    5: ["Merkür 5. evde: yaratıcı yazı, oyunlar ve espri senin keyif kaynağın."]
    6: ["Merkür 6. evde: iş hayatında analitik ve titizsin. Sağlık konusunda bilgi toplamayı seversin."]
    7: ["Merkür 7. evde: ilişkide iletişim her şey. Ortaklıklarda müzakereci yeteneğin var."]
    8: ["Merkür 8. evde: araştırmacı bir zihin; sırlar, psikoloji ve gizli bilgiler ilgini çeker."]
    9: ["Merkür 9. evde: felsefe, yabancı diller ve yüksek eğitim zihnini besler."]
    10: ["Merkür 10. evde: kariyerin iletişim, yazı ya da öğretimle bağlantılı olabilir."]
    11: ["Merkür 11. evde: fikirlerini topluluklarla paylaşırsın; ağ kurmakta ustasın."]
    12: ["Merkür 12. evde: düşüncelerin derin ve sezgisel; yalnızken en iyi fikirlerin gelir."]
  venus:
    1: ["Venüs 1. evde: çekiciliğin ve zarafetin ilk bakışta fark edilir. İnsanlar sana kolay ısınır."]
    2: ["Venüs 2. evde: güzel şeylere sahip olmayı seversin; para kazanma yolun estetik ve ilişkilerden geçebilir."]
    3: ["Venüs 3. evde: konuşman tatlı, kardeşlerle ve yakın çevreyle ilişkin uyumlu."]
    4: ["Venüs 4. evde: evin güzel ve huzurlu; aile içinde sevgi temel değer."]
    5: ["Venüs 5. evde: aşk ve keyif için çok iyi bir yer; romantik, yaratıcı ve eğlenceli."]
    6: ["Venüs 6. evde: iş yerinde uyum seversin; güzellik, sağlık ve hizmet alanları sana uyar."]
    7: ["Venüs 7. evde, doğal yerinde: ilişkiler ve ortaklıklar için bereketli bir konum."]
    8: ["Venüs 8. evde: aşkta derinlik ve tutku ararsın; ortak kaynaklardan kazanç olabilir."]
    9: ["Venüs 9. evde: yabancı kültürler, yolculuklar ve sanat aşk hayatına ilham verir."]
    10: ["Venüs 10. evde: kariyerde sevilen ve beğenilen biri olursun; sanat ya da diplomasi uygundur."]
    11: ["Venüs 11. evde: dostların değerli; aşk bir dostluktan doğabilir."]
    12: ["Venüs 12. evde: gizli aşklar ya da sessiz fedakârlıklar; sevgin derin ama saklı."]
  mars:
    1: ["Mars 1. evde: enerjin yüksek, cesaretin görünür. Hızlı ve atak bir kişiliğin var."]
    2: ["Mars 2. evde: parayı kazanmak için savaşırsın; enerjin maddi hedeflere yönelir."]
    3: ["Mars 3. evde: sözlerin keskin, zihnin hızlı. Tartışmalarda geri adım atmazsın."]
    4: ["Mars 4. evde: evde enerjik ya da gergin bir hava olabilir; ev işleri ve tadilat sana enerji verir."]
    5: ["Mars 5. evde: aşkta tutkulu, sporda ve yaratıcılıkta rekabetçisin."]
    6: ["Mars 6. evde: çok çalışırsın; enerjini düzenli egzersizle dengelemek sağlığına iyi gelir."]
    7: ["Mars 7. evde: ilişkilerde enerji ve çatışma birlikte gelir; güçlü kişilere çekilirsin."]
    8: ["Mars 8. evde: yoğun tutku, krizlerde soğukkanlılık ve derin bir dayanıklılık."]
    9: ["Mars 9. evde: inancın için savaşırsın; macera ve yolculuk enerjini besler."]
    10: ["Mars 10. evde: kariyerde hırslı ve rekabetçisin; liderlik pozisyonları sana uyar."]
    11: ["Mars 11. evde: gruplarda harekete geçiren kişisin; bir dava için arkadaşlarını toplarsın."]
    12: ["Mars 12. evde: öfken içe dönük olabilir; enerjini yalnız çalışmaya ya da gizli hizmete yönlendirirsin."]
  jupiter:
    1: ["Jüpiter 1. evde: iyimser, cömert ve şanslı bir aura. Kapılar sana kolay açılır."]
    2: ["Jüpiter 2. evde: maddi konularda bereket var; ama harcamada ölçüyü korumak gerek."]
    3: ["Jüpiter 3. evde: öğrenme ve iletişimde şans; kardeşlerle iyi ilişkiler."]
    4: ["Jüpiter 4. evde: geniş ve bereketli bir yuva; aile desteği güçlü."]
    5: ["Jüpiter 5. evde: aşkta, yaratıcılıkta ve çocuklarla ilgili konularda şans."]
    6: ["Jüpiter 6. evde: iş ortamında destek ve fırsat; sağlıkta aşırılıktan kaçınmak gerek."]
    7: ["Jüpiter 7. evde: ortaklıklarda ve evlilikte şans; cömert bir eş ya da ortak."]
    8: ["Jüpiter 8. evde: miras, ortak para ve krizlerden çıkışta şans."]
    9: ["Jüpiter 9. evde, doğal yerinde: yolculuk, eğitim ve inançta bereket."]
    10: ["Jüpiter 10. evde: kariyerde yükseliş ve itibar; tanınma şansı yüksek."]
    11: ["Jüpiter 11. evde: dostlar ve gruplar aracılığıyla gelen şans; umutlar gerçekleşir."]
    12: ["Jüpiter 12. evde: gizli bir koruma; zor anlarda beklenmedik yardım gelir."]
  saturn:
    1: ["Satürn 1. evde: ciddi ve olgun bir duruş; kendine güven zamanla gelir."]
    2: ["Satürn 2. evde: maddi güvenlik emekle kurulur; tutumlu ve dikkatlisin."]
    3: ["Satürn 3. evde: düşünce ve konuşmada ciddiyet; öğrenme disiplinle olgunlaşır."]
    4: ["Satürn 4. evde: aile ve kökler konusunda sorumluluk; kendi yuvanı geç ama sağlam kurarsın."]
    5: ["Satürn 5. evde: aşkta ve yaratıcılıkta temkin; zamanla olgunlaşan bir keyif."]
    6: ["Satürn 6. evde: çalışkan ve disiplinlisin; sağlıkta düzen şart."]
    7: ["Satürn 7. evde: ilişkiler ciddi ve sorumluluk dolu; geç ama kalıcı bir ortaklık."]
    8: ["Satürn 8. evde: ortak para ve krizlerde sorumluluk; derin korkularla yüzleşmek dersin."]
    9: ["Satürn 9. evde: inancını sınayarak kurarsın; yüksek eğitimde ciddiyet."]
    10: ["Satürn 10. evde: kariyerde zirveye adım adım tırmanırsın; otorite ve sorumluluk senin alanın."]
    11: ["Satürn 11. evde: az ama sadık dostlar; uzun vadeli hedefler."]
    12: ["Satürn 12. evde: iç dünyanda ağır bir sorumluluk; yalnızlıkta olgunlaşırsın."]
  uranus:
    1: ["Uranüs 1. evde: sıra dışı ve özgün bir kişilik; değişim senin doğan."]
    2: ["Uranüs 2. evde: gelirde dalgalanmalar ve beklenmedik kazanç yolları."]
    3: ["Uranüs 3. evde: ani fikirler, sıra dışı bir öğrenme biçimi."]
    4: ["Uranüs 4. evde: ev ve aile düzeninde değişkenlik; sık taşınmalar olabilir."]
    5: ["Uranüs 5. evde: aşkta ani başlangıçlar; yaratıcılığın deneysel."]
    6: ["Uranüs 6. evde: rutinden sıkılırsın; esnek ve yenilikçi çalışma biçimleri sana uyar."]
    7: ["Uranüs 7. evde: ilişkide özgürlük şart; alışılmadık ortaklıklar."]
    8: ["Uranüs 8. evde: ani dönüşümler ve beklenmedik ortak kaynak değişimleri."]
    9: ["Uranüs 9. evde: inançta özgürlük; beklenmedik yolculuklar."]
    10: ["Uranüs 10. evde: kariyerde ani değişimler; yenilikçi alanlarda başarı."]
    11: ["Uranüs 11. evde, doğal yerinde: sıra dışı dostlar ve ilerici gruplar."]
    12: ["Uranüs 12. evde: bilinçaltından gelen ani sezgiler."]
  neptun:
    1: ["Neptün 1. evde: rüya gibi bir aura; insanlar seni olduğundan farklı görebilir."]
    2: ["Neptün 2. evde: parayla ilişkin belirsiz olabilir; sanat ve şifa kazanç yolu olabilir."]
    3: ["Neptün 3. evde: şiirsel bir dil ve sezgisel bir düşünce."]
    4: ["Neptün 4. evde: aile ve evle ilgili idealler ya da belirsizlikler."]
    5: ["Neptün 5. evde: romantik aşklar ve sanatsal yaratıcılık."]
    6: ["Neptün 6. evde: iş hayatında hizmet idealleri; sağlıkta hassasiyet."]
    7: ["Neptün 7. evde: ilişkide idealleştirme; ruh eşi arayışı."]
    8: ["Neptün 8. evde: sezgisel derinlik; ortak kaynaklarda dikkat."]
    9: ["Neptün 9. evde: maneviyat ve inanç arayışı güçlü."]
    10: ["Neptün 10. evde: kariyerde sanat, şifa ya da ilham verme."]
    11: ["Neptün 11. evde: idealist dostlar ve hayalperest planlar."]
    12: ["Neptün 12. evde, doğal yerinde: derin bir iç dünya ve güçlü sezgiler."]
  pluton:
    1: ["Plüton 1. evde: yoğun ve etkileyici bir varlık; hayatın boyunca yeniden doğarsın."]
    2: ["Plüton 2. evde: para ve değerlerle ilgili derin dönüşümler."]
    3: ["Plüton 3. evde: sözlerin derin etki bırakır; zihnin araştırmacı."]
    4: ["Plüton 4. evde: aile kökleriyle ilgili derin dönüşümler ve sırlar."]
    5: ["Plüton 5. evde: aşkta ve yaratıcılıkta yoğun tutku."]
    6: ["Plüton 6. evde: iş ve sağlıkta köklü dönüşümler; derin bir çalışma azmi."]
    7: ["Plüton 7. evde: ilişkiler seni kökten değiştirir; güç dengesi önemli."]
    8: ["Plüton 8. evde, doğal yerinde: kriz ve dönüşümde olağanüstü bir dayanıklılık."]
    9: ["Plüton 9. evde: inanç sisteminde derin dönüşümler."]
    10: ["Plüton 10. evde: kariyerde güç ve etki; büyük dönüşümlere öncülük edebilirsin."]
    11: ["Plüton 11. evde: gruplarda güçlü bir etki; dostluklar seni dönüştürür."]
    12: ["Plüton 12. evde: bilinçaltında derin güçler; içsel şifa yolculuğu."]
  dugum:
    1: ["Kuzey Ay Düğümü 1. evde: büyümen kendini ortaya koymaktan geçer."]
    2: ["Kuzey Ay Düğümü 2. evde: büyümen kendi kaynaklarını kurmaktan geçer."]
    3: ["Kuzey Ay Düğümü 3. evde: büyümen öğrenmek ve iletişim kurmaktan geçer."]
    4: ["Kuzey Ay Düğümü 4. evde: büyümen yuvaya ve iç dünyaya dönmekten geçer."]
    5: ["Kuzey Ay Düğümü 5. evde: büyümen yaratıcılık ve kalpten yaşamaktan geçer."]
    6: ["Kuzey Ay Düğümü 6. evde: büyümen düzen ve hizmetten geçer."]
    7: ["Kuzey Ay Düğümü 7. evde: büyümen ortaklık ve iş birliğinden geçer."]
    8: ["Kuzey Ay Düğümü 8. evde: büyümen derin bağlar ve dönüşümden geçer."]
    9: ["Kuzey Ay Düğümü 9. evde: büyümen anlam arayışı ve ufkunu genişletmekten geçer."]
    10: ["Kuzey Ay Düğümü 10. evde: büyümen toplumda bir yer edinmekten geçer."]
    11: ["Kuzey Ay Düğümü 11. evde: büyümen topluluklara katılmaktan geçer."]
    12: ["Kuzey Ay Düğümü 12. evde: büyümen teslimiyet ve iç yolculuktan geçer."]
