kaynak: "Halk yıldıznamesi geleneği (ebced hesabı); metin özgün"
lang: tr
yontem: "Yıldızname geleneğinde kişinin adı ile annesinin adı harf harf ebced değerine çevrilip toplanır, toplam 12'ye bölünür ve kalan bir burca karşılık gelir (1 Koç … 11 Kova, kalan 0 Balık). Ebced Arap harflerine göre tanımlıdır; Latin harfle yazılmış Türkçe isimlerde her harf, Osmanlıca yazımda karşılık geldiği harfin değerini alır. Osmanlıca imlada sesli harflerin bir kısmı yazılmadığı için gerçek ebced toplamı farklı çıkabilir; burada sonuç Latin yazıma göredir."
uyari: "Bu yıldız, doğum haritandaki Güneş burcundan farklı olabilir; ikisi ayrı geleneklerdir."
yildizlar:
  koc: { ad: "Koç", element: "ateş", metin: "Yıldızın Koç: atılgan, cesur ve sabırsız bir ruh. Bir işe girdin mi sonuna kadar gidersin; ama öfken çabuk parlayıp çabuk söner. Yolun açık, ama aceleyi bırakırsan kısmetin daha da genişler.", ogut: "Başlamak senin işin; bitirmeyi de öğren." }
  boga: { ad: "Boğa", element: "toprak", metin: "Yıldızın Boğa: sabırlı, sadık ve bereketli. Elinde tuttuğunu kolay bırakmazsın; emeğinle kazanır, birikimle güçlenirsin. İnatçılığın hem kalkanın hem engelin.", ogut: "Toprağa güven, ama değişime de kapı arala." }
  ikizler: { ad: "İkizler", element: "hava", metin: "Yıldızın İkizler: konuşkan, meraklı ve çevik. Aklın aynı anda birçok yerde; insanlar seninle sohbetten hoşlanır. Kararsızlığın bazen kısmetini geciktirir.", ogut: "Bir işi seç ve onu derinleştir." }
  yengec: { ad: "Yengeç", element: "su", metin: "Yıldızın Yengeç: hassas, koruyucu ve evine bağlı. Sevdiklerin için her şeyi yaparsın; kırıldığında kabuğuna çekilirsin. Sezgilerin güçlüdür.", ogut: "Kabuğun seni korusun ama hapsetmesin." }
  aslan: { ad: "Aslan", element: "ateş", metin: "Yıldızın Aslan: cömert, gururlu ve parlak. Bulunduğun yerde fark edilirsin; insanları korumayı ve yönetmeyi seversin. Gururunu incitenleri zor affedersin.", ogut: "Işığını paylaş; taç alçakgönüllüye daha çok yakışır." }
  basak: { ad: "Başak", element: "toprak", metin: "Yıldızın Başak: titiz, çalışkan ve akıllı. Detayları kimse senin gibi görmez; hizmet etmekten mutluluk duyarsın. Kendine fazla yüklenme eğilimin var.", ogut: "Mükemmel değil, yeterince iyi de güzeldir." }
  terazi: { ad: "Terazi", element: "hava", metin: "Yıldızın Terazi: zarif, adil ve uyumlu. Çatışmayı sevmez, dengeyi ararsın; güzelliğe ve ilişkilere önem verirsin. Kararsızlık zaman zaman seni yorar.", ogut: "Herkesi memnun etmek zorunda değilsin." }
  akrep: { ad: "Akrep", element: "su", metin: "Yıldızın Akrep: derin, tutkulu ve sezgili. Ya hep ya hiç dersin; sırlarını kolay açmazsın. Dönüşüm gücün büyük: küllerinden doğarsın.", ogut: "Kin tutma; enerjin yeniden doğuşa kalsın." }
  yay: { ad: "Yay", element: "ateş", metin: "Yıldızın Yay: özgür, iyimser ve maceracı. Yolculuk ve öğrenme sana iyi gelir; sözünü dobra söylersin. Kısıtlanmaya gelemezsin.", ogut: "Okunu uzağa at, ama hedefini unutma." }
  oglak: { ad: "Oğlak", element: "toprak", metin: "Yıldızın Oğlak: azimli, sorumlu ve sabırlı. Zirveye adım adım tırmanırsın; geç olsa da kalıcı başarı senindir. Duygularını göstermekte zorlanırsın.", ogut: "Zirve yolunda dinlenmeyi de bil." }
  kova: { ad: "Kova", element: "hava", metin: "Yıldızın Kova: özgün, bağımsız ve ileri görüşlü. Kalabalıktan farklı düşünürsün; dostluk ve özgürlük senin için kutsaldır. Duygusal mesafen yanlış anlaşılabilir.", ogut: "Farklılığın armağanın; kalbini de göster." }
  balik: { ad: "Balık", element: "su", metin: "Yıldızın Balık: hayalperest, şefkatli ve sezgili. Başkalarının acısını kendi acın gibi hissedersin; sanat ve maneviyat sana yakındır. Sınır koymakta zorlanırsın.", ogut: "Şefkatin büyük; kendini de onun içine kat." }
