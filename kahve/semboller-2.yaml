kaynak: "Türk kahvesi falı halk geleneği ve kamu malı tasseografi kaynakları; metin özgün"
lang: tr
semboller:
  # Hayvanlar (ek)
  - { key: leylek, ad: "Leylek", kat: hayvan, ton: 1, anlam: "Uzaktan gelen bir haber, yuvaya bereket; bazen bir doğum müjdesi." }
  - { key: marti, ad: "Martı", kat: hayvan, ton: 0, anlam: "Deniz aşırı bir haber ya da huzursuz bir bekleyiş." }
